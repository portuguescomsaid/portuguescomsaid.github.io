<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A6B4B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Português">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<title>Português com Said</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Lexend:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one centered column; the path of levels is the spine, chapters open as 5-step lessons; tab bar sits at the bottom on phones */
  --paper:#F2F5EF; --card:#FFFFFF; --ink:#13261C; --muted:#5A6B60; --line:#D8E1D4;
  --green:#0A6B4B; --on-green:#FFFFFF; --green-soft:#E0EFE6;
  --sun:#E8AE00; --sun-soft:#FBF1CF; --blue:#24408E; --blue-soft:#E3E8F6;
  --ok:#0F8A54; --ok-soft:#DCF2E5; --bad:#BF3434; --bad-soft:#FAE3E1;
  --f-pt:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1410; --card:#141F19; --ink:#E5EDE7; --muted:#97AA9E; --line:#26362D;
  --green:#3CBD87; --on-green:#07130D; --green-soft:#16302A;
  --sun:#F3C43B; --sun-soft:#3A3013; --blue:#9DB1F2; --blue-soft:#1B2440;
  --ok:#45C489; --ok-soft:#14352A; --bad:#F07C74; --bad-soft:#3A1E1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1410; --card:#141F19; --ink:#E5EDE7; --muted:#97AA9E; --line:#26362D;
  --green:#3CBD87; --on-green:#07130D; --green-soft:#16302A;
  --sun:#F3C43B; --sun-soft:#3A3013; --blue:#9DB1F2; --blue-soft:#1B2440;
  --ok:#45C489; --ok-soft:#14352A; --bad:#F07C74; --bad-soft:#3A1E1D; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:84px}
.pt{font-family:var(--f-pt);unicode-bidi:isolate}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header + nav */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.brand .pt{font-family:"Bricolage Grotesque",var(--f-pt);font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--green)}
.brand small{color:var(--muted);font-size:13px}
.flag{display:inline-block;width:10px;height:10px;background:var(--sun);transform:rotate(45deg);border-radius:2px;margin-inline-start:2px}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-weight:700}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--green)}
@media (min-width:820px){
  body{padding-bottom:24px}
  nav.tabs{position:sticky;top:58px;bottom:auto;display:flex;justify-content:center;gap:4px;background:var(--paper);border-top:0;border-bottom:1px solid var(--line);padding:6px}
  nav.tabs a{flex-direction:row;gap:6px;padding:7px 14px;border-radius:99px;font-size:14px}
  nav.tabs a svg{width:18px;height:18px}
  nav.tabs a.on{background:var(--green-soft)}
}
main{padding:20px 0 32px}
.stack{display:flex;flex-direction:column;gap:16px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.eyebrow{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 18px;font-weight:600;text-decoration:none;min-height:46px}
.btn.primary{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn.sun{background:var(--sun);color:#1D1700;border-color:var(--sun)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--green-soft);color:var(--green)}
.spk:active{transform:scale(.94)}
.pager{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* home */
.hello h1{font-size:26px}
.hello p{margin:6px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-pt);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:440px){.stats{grid-template-columns:repeat(2,1fr)}}
.continue{display:grid;gap:4px;text-decoration:none;background:var(--green);color:var(--on-green);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.continue .eyebrow{color:inherit;opacity:.85}
.continue .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.continue .cta{margin-top:10px;display:inline-flex;align-self:start;background:var(--sun);color:#1D1700;font-weight:700;padding:8px 16px;border-radius:99px}
.continue .bar{height:6px;background:color-mix(in srgb,var(--on-green) 25%,transparent);border-radius:9px;margin-top:8px;overflow:hidden}
.continue .bar i{display:block;height:100%;background:var(--sun)}
.level{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.level-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.level-h h2{font-size:19px}
.level-h .tag{font-family:var(--f-pt);font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:2px 8px;font-size:13px}
.nodes{display:flex;flex-direction:column;gap:8px}
.node{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);text-decoration:none;background:var(--paper)}
.node .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-pt);font-weight:800;background:var(--card);border:2px solid var(--line)}
.node .t{display:flex;flex-direction:column;line-height:1.35}
.node .t .pt{font-weight:700}
.node .t small{color:var(--muted)}
.node .st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.node.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.node.done .st{background:var(--ok-soft);color:var(--ok)}
.node.open{border-color:var(--green);background:var(--green-soft)}
.node.open .num{border-color:var(--green);color:var(--green)}
.node.open .st{background:var(--green);color:var(--on-green)}
.node.locked{opacity:.55}
.node.locked .st{background:var(--line);color:var(--muted)}
.node.exam .num{border-radius:10px;background:var(--sun-soft);border-color:var(--sun)}
.node.exam.done .num{background:var(--sun);border-color:var(--sun);color:#1D1700}
.settings{display:grid;gap:10px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch:checked{background:var(--green)}
.switch:checked::after{right:21px}

/* chapter */
.ch-head{display:grid;gap:4px}
.ch-head .pt{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--green)}
.back{font-size:14px;color:var(--muted);text-decoration:none;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-pt);font-weight:800;background:var(--paper);border:1px solid var(--line);font-size:12px}
.step.on{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.step.ok i{background:var(--ok);color:#fff;border-color:var(--ok)}
.lesson h3{font-size:18px;margin:18px 0 8px;color:var(--blue)}
.lesson h3:first-child{margin-top:0}
.lesson p{margin:0 0 10px;max-width:65ch}
.tbl{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:15px}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:700}
.tbl td.pt{font-weight:700;direction:ltr;text-align:left}
.tip{background:var(--sun-soft);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
.tip b{color:var(--ink)}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ex .pt{font-weight:700;direction:ltr}
.ex .ar{color:var(--muted);font-size:14px;margin-inline-start:auto;text-align:left}
.ex-list{display:flex;flex-direction:column}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.wcard .pt{font-size:20px;font-weight:700;direction:ltr;text-align:right}
.wcard .pron{color:var(--muted);font-size:13px}
.wcard .mean{grid-column:1/-1;font-weight:600;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.wcard .spk{grid-row:1/3;grid-column:2}
.hide-mean .mean{filter:blur(6px);cursor:pointer;user-select:none}
.hide-mean .mean.peek{filter:none}
.slist{display:flex;flex-direction:column;gap:8px}
.sitem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.sitem .pt{font-size:18px;font-weight:700;direction:ltr;text-align:right}
.sitem .ar{grid-column:2;color:var(--muted)}
.sitem .slow{grid-row:1/3;grid-column:3;font-size:12px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 10px}
.sitem .spk{grid-row:1/3}
.ch-label{font-size:13px;font-weight:700;color:var(--blue);margin:10px 0 2px}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums;font-family:var(--f-pt)}
.qbar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--green);transition:width .3s}
.sec-tag{align-self:start;font-size:13px;font-weight:700;background:var(--blue-soft);color:var(--blue);border-radius:99px;padding:3px 12px}
.passage{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.passage p{margin:0;font-family:var(--f-pt);font-size:17px;line-height:1.65;text-align:left}
.qlab{margin:0;font-size:17px;font-weight:700}
.qword{display:flex;align-items:center;gap:12px;justify-content:center;padding:14px;background:var(--paper);border-radius:14px}
.qword .pt{font-size:28px;font-weight:800;direction:ltr}
.qword.ar-big{font-size:24px;font-weight:700}
.listen-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px}
.listen-big{width:96px;height:96px;border-radius:50%;border:0;background:var(--green);color:var(--on-green);display:grid;place-items:center}
.listen-big svg{width:40px;height:40px}
.linkbtn{background:none;border:0;color:var(--green);font-weight:700;text-decoration:underline;padding:4px}
.opts{display:grid;gap:8px}
.opt{text-align:start;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:600;min-height:52px}
.opt.pt{direction:ltr;text-align:left}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.tin{width:100%;font-family:var(--f-pt);font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);direction:ltr;text-align:left}
.tin:focus{border-color:var(--green);outline:none}
.accents{display:flex;gap:6px;flex-wrap:wrap;direction:ltr}
.accents button{font-family:var(--f-pt);border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:38px;font-size:17px}
.fb{border-radius:12px;padding:0;font-weight:600}
.fb.show{padding:12px 14px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.mid{background:var(--sun-soft);color:var(--ink)}
.fb .ans{display:block;color:var(--ink);font-family:var(--f-pt);font-size:17px;direction:ltr;text-align:left;margin-top:4px}
.ansline{min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr;align-content:flex-start}
.tiles{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center}
.tile{font-family:var(--f-pt);font-size:18px;font-weight:700;border:1px solid var(--line);border-bottom-width:3px;background:var(--card);border-radius:10px;padding:8px 12px}
.tile.used{visibility:hidden}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring b{width:112px;height:112px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--f-pt);font-size:34px;font-weight:800}
.review{text-align:start;width:100%;display:flex;flex-direction:column;gap:6px}
.review div{background:var(--paper);border-radius:10px;padding:8px 12px;font-size:15px}
.review .pt{direction:ltr;display:inline-block;font-weight:700}
.secbars{width:100%;display:grid;gap:10px;text-align:start}
.secbar{display:grid;grid-template-columns:80px 1fr 48px;gap:10px;align-items:center;font-weight:600}
.secbar .tr{height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.secbar .tr i{display:block;height:100%;border-radius:9px}
.secbar span:last-child{font-family:var(--f-pt);font-variant-numeric:tabular-nums;text-align:left}

/* games */
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gcard{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:4px;min-height:120px}
.gcard .gi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-pt);font-weight:800;font-size:18px;margin-bottom:4px}
.gcard h3{font-size:17px}
.gcard p{margin:0;font-size:13px;color:var(--muted)}
.gcard small{margin-top:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ghead{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;margin-bottom:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 8px;font-weight:700;font-size:16px;min-height:54px}
.mt.pt{direction:ltr}
.mt.sel{border-color:var(--blue);background:var(--blue-soft)}
.mt.gone{opacity:.2;border-color:var(--ok)}
.shake{animation:shake .35s;border-color:var(--bad)!important}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tf{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.tf .pair{width:100%;background:var(--paper);border-radius:16px;padding:22px 12px;display:grid;gap:6px}
.tf .pair .pt{font-size:30px;font-weight:800}
.tf .pair .ar{font-size:22px;font-weight:600}
.tf .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tf .btns button{min-height:60px;font-size:18px;font-weight:700;border-radius:14px;border:0}
.tf .yes{background:var(--ok);color:#fff}
.tf .no{background:var(--bad);color:#fff}
.timer{font-family:var(--f-pt);font-variant-numeric:tabular-nums;font-size:20px;font-weight:800}
.flash{perspective:900px;width:100%}
.flash .face{min-height:220px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;cursor:pointer}
.flash .face .pt{font-size:36px;font-weight:800;direction:ltr}
.flash .face.back{background:var(--green-soft)}
.flash .face .ar{font-size:26px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v2 additions */
nav.tabs{grid-template-columns:repeat(6,1fr)}
nav.tabs a{font-size:11px}
@media (min-width:820px){nav.tabs a{font-size:14px}}
.lesson em,.card em{font-style:normal;font-family:var(--f-pt);font-weight:700;color:var(--green);unicode-bidi:isolate;direction:ltr;cursor:pointer;border-bottom:1px dotted var(--green)}
.lesson b[dir="ltr"]{font-family:var(--f-pt);unicode-bidi:isolate}
.ex{align-items:flex-start}
.ex .spk{margin-top:2px}
.ex-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.ex-t .pt{font-weight:700;font-size:17px;direction:ltr;text-align:right}
.pron{color:var(--blue);font-size:14px;font-weight:500}
.ex-t .ar{color:var(--muted);font-size:15px;margin:0;text-align:right}
.tbl-wrap{overflow-x:auto;margin:6px 0 12px}
.tbl{margin:0}
.tbl td.pt{white-space:nowrap}
.mini{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:0;background:var(--green-soft);color:var(--green);vertical-align:middle;margin-inline-end:6px;padding:0}

function sylWord(w){
  if(_sylCache.has(w))return _sylCache.get(w);
  const lw=w.toLowerCase();const units=[];let i=0;
  while(i<lw.length){const c=lw[i],n=lw[i+1]||'';
    if((c==='q'||c==='g')&&n==='u'&&isVow(lw[i+2])){units.push({v:false,s:w.substr(i,2),k:c+n});i+=2;continue}
    if((c==='c'||c==='l'||c==='n')&&n==='h'){units.push({v:false,s:w.substr(i,2),k:c+n});i+=2;continue}
    units.push({v:isVow(c),s:w[i],k:c});i++}
  // nuclei
  const parts=[];// sequence of {type:'N'|'C', items:[]}
  for(let j=0;j<units.length;j++){const u=units[j];
    if(!u.v){parts.push({t:'C',s:u.s,k:u.k});continue}
    const last=parts[parts.length-1];
    if(last&&last.t==='N'){const prev=last.k[last.k.length-1],c=u.k;
      let join=false;
      if((c==='i'||c==='u')&&prev!==c){join=true;const nx=units[j+1],nx2=units[j+2];
        if(nx&&!nx.v&&(nx.k==='nh'||(/^[rlzmn]$/.test(nx.k)&&(!nx2||!nx2.v))))join=false;
        if(last.k.length>=2)join=false}
      if(/[ãõ]/.test(prev)&&(c==='o'||c==='e'||c==='i'))join=true;
      if(join){last.s+=u.s;last.k+=c;continue}}
    parts.push({t:'N',s:u.s,k:u.k})}

  if(nIdx.length<=1){const r=[w];_sylCache.set(w,r);return r}
  const syl=[];let start=0;
  for(let a=0;a<nIdx.length-1;a++){const n1=nIdx[a],n2=nIdx[a+1];const cons=parts.slice(n1+1,n2);let cut;
    if(cons.length===0)cut=n1+1;
    else if(cons.length===1)cut=n1+1;
    else{const l2=cons.slice(-2).map(x=>x.k).join('');cut=CLUSTER.test(l2)?n2-2:n2-1}
    syl.push(parts.slice(start,cut).map(p=>p.s).join(''));start=cut}
  syl.push(parts.slice(start).map(p=>p.s).join(''));
  _sylCache.set(w,syl);return syl;
}

function emojis(text,max){
  const n=nrm(text);const out=[];
  for(const p in PHRASE){if((' '+n+' ').includes(' '+p+' ')&&!out.includes(PHRASE[p]))out.push(PHRASE[p])}
  for(const t of n.split(' ')){if(out.length>=max)break;if(!t)continue;
    let e=EX[t];
    if(e===undefined&&t.length>=4){const s=STEMS.find(([k])=>t.startsWith(k));if(s)e=s[1]}
    if(e&&!out.includes(e))out.push(e)}
  return out.slice(0,max);
}

EXAMS[6]={chs:[23,24,25,26],passage:'No sábado passado, eu acordei cedo e fui à feira com a minha esposa. Compramos frutas e legumes. Depois, a gente almoçou na casa de um amigo. Quando eu era criança, eu ia à feira com o meu pai todo domingo. Eu gostava muito. À noite, estava muito frio, então ficamos em casa e vimos um filme.',

C({id:43,u:11,pt:'Dar opinião',ar:'إبداء الرأي والاتفاق والاختلاف',
lesson:H('كيف تبدأ رأيك')+X(`Eu acho que...|إيو آشو كي|أظن أن...
Na minha opinião...|نا مينيا أوبينياو|برأيي...
Pra mim...|برا مين|بالنسبة لي... (كلام)
Eu acredito que...|إيو أكريدجيتو كي|أعتقد أن...
Me parece que...|مي باريسي كي|يبدو لي أن...
Sinceramente...|سينسيرامينتشي|بصراحة...`)+
H('الموافقة')+X(`Concordo com você.|كونكوردو كون ڤوسيه.|أوافقك.
Com certeza!|كون سيرتيزا!|بالتأكيد!
Exatamente.|إيزاتامينتشي.|بالضبط.
Você tem razão.|ڤوسيه تين هازاو.|معك حق.
É verdade.|إيه ڤيردادجي.|صحيح.`)+
H('الاختلاف بأدب')+X(`Não concordo muito.|ناو كونكوردو موينتو.|لا أوافق كثيرًا.
Discordo, porque...|دجيسكوردو، بوركي|لا أوافق، لأن...
Entendo, mas...|إينتيندو، ماس|أفهم، لكن...

Depende.|ديبيندجي.|يعتمد.
Por um lado..., por outro lado...|بور أوم لادو، بور أوترو لادو|من جهة... ومن جهة أخرى...`)+

H('السؤال عن الرأي')+X(`O que você acha?|أو كي ڤوسيه آشا؟|ما رأيك؟

achar|آشار|يظن / يجد
acreditar|أكريدجيتار|يعتقد
concordar|كونكوردار|يوافق
discordar|دجيسكوردار|يخالف
razão|هازاو|حق / سبب
verdade|ڤيردادجي|حقيقة
certeza|سيرتيزا|يقين
depender|ديبينديير|يعتمد
lado|لادو|جهة
sinceramente|سينسيرامينتشي|بصراحة
parecer|باريسير|يبدو
ponto de vista|بونتو دجي ڤيستا|وجهة نظر
discussão|دجيسكوساو|نقاش`,
s:`Eu acho que você tem razão.|إيو آشو كي ڤوسيه تين هازاو.|أظن أن معك حقًا.
Na minha opinião, São Paulo é muito organizada.|نا مينيا أوبينياو، ساو باولو إيه موينتو أورغانيزادا.|برأيي ساو باولو منظمة جدًا.
O que você acha?|أو كي ڤوسيه آشا؟|ما رأيك؟

Não concordo muito.|ناو كونكوردو موينتو.|لا أوافق كثيرًا.
Entendo, mas não é bem assim.|إينتيندو، ماس ناو إيه بين آسين.|أفهم، لكن الأمر ليس هكذا تمامًا.
Depende da situação.|ديبيندجي دا سيتواساو.|يعتمد على الوضع.
Por outro lado, o transporte é bom.|بور أوترو لادو، أو ترانسبورتشي إيه بون.|من جهة أخرى، النقل جيد.
Me parece uma boa ideia.|مي باريسي أوما بوا إيديا.|تبدو لي فكرة جيدة.
Sinceramente, eu prefiro o verão.|سينسيرامينتشي، إيو بريفيرو أو ڤيراو.|بصراحة، أفضّل الصيف.`,

___ com você.|أوافقك.|Concordo|Concorda|Concordar
Na minha ___, é caro.|برأيي هو غالٍ.|opinião|razão|verdade
Você tem ___.|معك حق.|razão|razões|certo de
___ da situação.|يعتمد على الوضع.|Depende|Dependo|Dependente
Por outro ___, é bom.|من جهة أخرى، هو جيد.|lado|parte de|ponto

EXAMS[11]={chs:[43,44,45,46],passage:'Na minha opinião, a cidade onde moro é ótima para famílias. Por um lado, o transporte é organizado e há muitos parques. Por outro lado, o inverno é longo e o aluguel está caro. Quando cheguei, tudo me parecia estranho, mas aos poucos me acostumei. Além disso, a cidade foi planejada nos anos setenta, por isso é bem organizada.',

EXAMS[12]={chs:[47,48,49,50],passage:'Querida Laila, espero que você esteja bem. Fico muito feliz que você venha nos visitar em dezembro! Quando você chegar ao aeroporto, me ligue. Se fizer frio, traga um casaco, porque aqui o tempo muda muito. Talvez a gente vá à praia no fim de semana, mas duvido que esteja calor. Tomara que dê tudo certo com a sua viagem!',

EXAMS[13]={chs:[51,52,53,54],passage:'Ontem meu chefe disse que a empresa ia abrir uma nova filial em São Paulo. Ele perguntou se eu gostaria de trabalhar lá. Se eu fosse solteiro, aceitaria na hora. Mas tenho pensado muito na minha família. Quando cheguei em casa, minha esposa já tinha sabido da notícia por uma amiga. Ela disse que nós deveríamos conversar com calma.',

EXAMS[14]={chs:[55,56,57],passage:'No sábado teve churrasco na casa do Marcos. Ele me convidou: "Bora? Vai ser massa!" Eu topei e levei uma sobremesa. Cheguei um pouco atrasado, mas tava de boa, porque no Brasil isso é normal. Lá, o pessoal falava pelos cotovelos sobre futebol. Eu paguei mico quando confundi o nome do time do Marcos, mas todo mundo riu.',

C({id:77,u:20,pt:'Coesão textual',ar:'ترابط النص والروابط الراقية',

TIP('هذه الروابط للكتابة الرسمية والأكاديمية. في الكلام تبدو متكلفة. <em>outrossim</em> و<em>destarte</em> تظهر خاصة في النصوص القانونية.')+
H('أدوات الإحالة')+Pp('لتجنب التكرار، يشير الكاتب إلى ما سبق:')+X(`O prefeito e o governador se reuniram. Este falou primeiro; aquele, depois.|أو بريفيتو إي أو غوڤيرنادور سي هيونيران. إيستشي فالو بريميرو؛ أكيلي، دجيبويس.|اجتمع رئيس البلدية والحاكم. هذا (الأقرب: الحاكم) تكلم أولًا، وذاك (رئيس البلدية) بعده.
A empresa lançou um produto. Tal iniciativa foi bem recebida.|آ إيمبريزا لانسو أوم برودوتو. تاو إينيسياتشيڤا فوي بين هيسيبيدا.|أطلقت الشركة منتجًا. وقد لقيت هذه المبادرة ترحيبًا.
Os dados foram analisados; os resultados, por sua vez, surpreenderam.|أوس دادوس فوران آناليزادوس؛ أوس هيزولتادوس، بور سوا ڤيز، سوربريينديران.|حُللت البيانات، والنتائج بدورها فاجأت.`)+
TIP('<b>este / aquele</b> في الإحالة: <em>este</em> للأقرب في النص (المذكور أخيرًا)، و<em>aquele</em> للأبعد (المذكور أولًا).')+
H('أمثلة')+X(`O projeto é caro; não obstante, é necessário.|أو بروجيتو إيه كارو؛ ناو أوبستانتشي، إيه نيسيساريو.|المشروع مكلف، بالرغم من ذلك هو ضروري.

À medida que aprendemos, ficamos mais confiantes.|آ ميدجيدا كي أبريينديموس، فيكاموس مايس كونفيانتشيس.|كلما تعلمنا أصبحنا أكثر ثقة.`),
w:`não obstante|ناو أوبستانتشي|بالرغم من ذلك
todavia|توداڤيا|إلا أن
contudo|كونتودو|مع ذلك
conquanto|كونكوانتو|وإن كان
porquanto|بوركوانتو|إذ إن
haja vista|آجا ڤيستا|نظرًا لـ
outrossim|أوتروسين|علاوة على ذلك
mormente|مورمينتشي|خصوصًا
por conseguinte|بور كونسيغينتشي|وبالتالي
à medida que|آ ميدجيدا كي|كلما
tal|تاو|هذا / مثل هذا
por sua vez|بور سوا ڤيز|بدوره
coesão|كوِيزاو|ترابط
coerência|كوِيرينسيا|اتساق`,
s:`O projeto é caro; não obstante, é necessário.|أو بروجيتو إيه كارو؛ ناو أوبستانتشي، إيه نيسيساريو.|المشروع مكلف، ومع ذلك ضروري.
Haja vista a demanda, abriremos outra filial.|آجا ڤيستا آ ديماندا، أبريريموس أوترا فيلياو.|نظرًا للطلب سنفتح فرعًا آخر.
À medida que aprendemos, ficamos mais confiantes.|آ ميدجيدا كي أبريينديموس، فيكاموس مايس كونفيانتشيس.|كلما تعلمنا زادت ثقتنا.
Tal iniciativa foi bem recebida.|تاو إينيسياتشيڤا فوي بين هيسيبيدا.|لقيت هذه المبادرة ترحيبًا.
O plano é bom; todavia, falta dinheiro.|أو بلانو إيه بون؛ توداڤيا، فالتا دجينييرو.|الخطة جيدة، إلا أن المال ينقص.
Os resultados, por sua vez, surpreenderam.|أوس هيزولتادوس، بور سوا ڤيز، سوربريينديران.|النتائج بدورها فاجأت.
Por conseguinte, a proposta foi aprovada.|بور كونسيغينتشي، آ بروبوستا فوي أبروڤادا.|وبالتالي تمت الموافقة على الاقتراح.
Conquanto seja difícil, é possível.|كونكوانتو سيجا دجيفيسيو، إيه بوسيڤيو.|وإن كان صعبًا فهو ممكن.
Mormente no inverno, a cidade fica vazia.|مورمينتشي نو إينڤيرنو، آ سيدادجي فيكا ڤازيا.|خصوصًا في الشتاء تصبح المدينة خالية.
O texto precisa de mais coesão.|أو تيكستو بريسيزا دجي مايس كوِيزاو.|النص يحتاج ترابطًا أكثر.`,
d:`O projeto é caro; não ___, é necessário.|بالرغم من ذلك...|obstante|obstáculo|obstinado
___ vista a demanda, abriremos outra filial.|نظرًا للطلب...|Haja|Há|Aja
À ___ que aprendemos, ficamos confiantes.|كلما تعلمنا...|medida|medição|média
Conquanto ___ difícil, é possível.|وإن كان صعبًا...|seja|é|for de
Por ___, a proposta foi aprovada.|وبالتالي...|conseguinte|conseguir|seguinte

O prefeito e o governador falaram. ___ (o governador) falou primeiro.|الأقرب في النص|Este|Aquele|Esse de`});

C({id:79,u:20,pt:'Crase',ar:'علامة الدمج à: متى تكتبها',

C({id:87,u:22,pt:'Ironia e eufemismos',ar:'السخرية والتلطيف وما بين السطور',

H('مثال (يمكنك تعديله)')+SRC('pitch','Muito prazer, eu sou a Mariana, designer com mais de dez anos de experiência. Muitas pequenas empresas em São Paulo têm ótimos produtos, mas uma imagem fraca nas redes sociais. Eu crio fotos, vídeos e identidade visual que transformam a marca e atraem clientes. Já trabalhei com marcas no Brasil e no exterior, e falo inglês, espanhol e português. Que tal marcarmos uma conversa de quinze minutos esta semana?','تشرفنا، أنا ماريانا، مصممة بخبرة أكثر من عشر سنوات. كثير من الشركات الصغيرة في ساو باولو لديها منتجات ممتازة لكن صورة ضعيفة على مواقع التواصل. أنا أصنع صورًا وفيديوهات وهوية بصرية تغيّر العلامة وتجذب العملاء. عملت مع علامات في البرازيل وخارجها، وأتكلم الإنجليزية والإسبانية والبرتغالية. ما رأيك أن نرتب حديثًا لربع ساعة هذا الأسبوع؟')+

EXAMS.f5={chs:[77,78,79,80,81,82,83,84,85,86,87,88,89,90,91,92],final:true,passage:'Conquanto a integração de imigrantes seja um tema recorrente na mídia, observa-se que poucas políticas públicas tratam da questão linguística. Haja vista que o domínio do idioma é condição para o acesso ao mercado de trabalho, convém que se ampliem os cursos gratuitos. Não obstante os avanços recentes, muitos imigrantes ainda enfrentam barreiras. Em suma, investir na língua é investir na cidadania.',

envergonhado|إينڤيرغونيادو|خجلان

s:`Fiquei emocionado com a sua mensagem.|فيكيي إيموسيونادو كوم آ سوا مينساجين.|تأثرت برسالتك.

Fiquei sem graça na frente de todos.|فيكيي سين غراسا نا فرينتشي دجي تودوس.|انحرجت قدام الكل.
Tenho orgulho dos meus filhos.|تينيو أورغوليو دوس ميوس فيليوس.|أنا فخور بولادي.
Sinto muito pela sua perda.|سينتو مويتو بيلا سوا بيردا.|البقية بحياتك.

C({id:94,u:24,pt:'Resolver conflitos',ar:'حل الخلافات والاعتذار',
lesson:H('الاعتذار بدرجات')+TB(`Desculpa!|عادي، غلطة صغيرة

H('كيف تعترض بأدب')+Pp('بدل ما تقول «Você está errado» (إنت غلطان)، البرازيليين بيفضّلوا يخففوا الكلام:')+
X(`Acho que houve um mal-entendido.|أشو كي أوڤي أون ماو إينتينجيدو.|بظن صار سوء فهم.
Entendo o seu lado, mas...|إينتيندو أو سيو لادو، ماس...|فاهم وجهة نظرك، بس...
Talvez a gente possa encontrar uma solução.|تاوڤيز آ جينتشي بوسا إينكونترار أوما سولوساو.|يمكن نلاقي حل.
Não foi isso que eu quis dizer.|ناو فوي إيسو كي إيو كيز دجيزير.|مش هيك قصدي.
Vamos com calma.|ڤاموس كوم كاوما.|خلينا نهدى.`)+
H('بعد الخلاف')+X(`Está tudo certo entre nós?|إيستا تودو سيرتو إينتري نوس؟|كله تمام بيناتنا؟
Não tem problema, já passou.|ناو تين بروبليما، جا باسو.|ما في مشكلة، خلصت.
Desculpa se te magoei.|دجيسكولبا سي تشي ماغوي.|آسف إذا زعّلتك.`)+
TIP('«mal-entendido» = سوء فهم. استعمالها بيخفف التوتر لأنها ما بتحمّل حدا الغلط مباشرة.'),
w:`mal-entendido|ماو إينتينجيدو|سوء فهم
discussão|دجيسكوساو|نقاش / خناقة
briga|بريغا|خناقة
conflito|كونفليتو|خلاف
culpa|كولبا|ذنب
desculpa|دجيسكولبا|اعتذار
perdoar|بيردوار|يسامح
magoar|ماغوار|يجرح / يزعّل
ofender|أوفيندير|يهين
acalmar|أكاومار|يهدّي
resolver|هيزولڤير|يحل
ceder|سيدير|يتنازل
acordo|أكوردو|اتفاق
paciência|باسيينسيا|صبر`,
s:`Peço desculpas pelo atraso.|بيسو دجيسكولباس بيلو أتْرازو.|بعتذر عن التأخير.
Não foi minha intenção te magoar.|ناو فوي مينيا إينتينساو تشي ماغوار.|ما كان قصدي أزعلك.
Acho que houve um mal-entendido.|أشو كي أوڤي أون ماو إينتينجيدو.|بظن صار سوء فهم.
Vamos conversar com calma.|ڤاموس كونڤيرسار كوم كاوما.|خلينا نحكي بهدوء.
Entendo o seu ponto de vista.|إينتيندو أو سيو بونتو دجي ڤيستا.|فاهم وجهة نظرك.
Cada um pode ceder um pouco.|كادا أون بودجي سيدير أون بوكو.|كل واحد بيقدر يتنازل شوي.
Eu te perdoo.|إيو تشي بيردوو.|أنا مسامحك.
Chegamos a um acordo.|شيغاموس آ أون أكوردو.|وصلنا لاتفاق.
Não quero brigar com você.|ناو كيرو بريغار كوم ڤوسي.|ما بدي أتخانق معك.
Está tudo certo entre nós.|إيستا تودو سيرتو إينتري نوس.|كله تمام بيناتنا.`,
d:`Acho que houve um mal-___.|سوء فهم|entendido|entender|entendo

Não foi minha ___ te magoar.|ما كان قصدي|intenção|intenso|intento

Vamos conversar com ___.|بهدوء|calma|calmo de|acalmar`});

s:`Quero reservar um quarto para duas noites.|كيرو هيزيرڤار أون كوارتو بارا دواس نويتشيس.|بدي أحجز غرفة لليلتين.

A|De nada, querida. Até logo!|دجي نادا، كيريدا. أتيه لوغو!|العفو يا حبيبتي. لنشوفك!`,
q:[['متى صار الحوار؟','بعد الظهر/المسا','الصبح','بالليل'],['شو سألت ليلى؟','وين المخبز','كم الساعة','شو اسمها'],['شو بتقول البنت للشكر؟','Obrigada','Obrigado','De nada']]},
3:{sp:['Atendente','Karim'],l:`A|Olá! Qual é o seu nome?|أولا! كواو إيه أو سيو نومي؟|مرحبا! شو اسمك؟
B|Meu nome é Karim. Eu sou da Palestina.|ميو نومي إيه كريم. إيو سو دا باليستشينا.|اسمي كريم. أنا من فلسطين.
A|Prazer, Karim! O que você faz?|برازير، كريم! أو كي ڤوسي فاز؟|تشرفنا يا كريم! شو بتشتغل؟
B|Eu sou cozinheiro. E você?|إيو سو كوزينييرو. إي ڤوسي؟|أنا طبّاخ. وإنتِ؟
A|Eu sou professora. Você é casado?|إيو سو بروفيسورا. ڤوسي إيه كازادو؟|أنا معلمة. إنت متزوج؟
B|Sou, sim. Minha esposa é muito simpática.|سو، سين. مينيا إسبوزا إيه مويتو سيمباتشيكا.|آه. مرتي لطيفة كتير.
A|Que legal! Bem-vindo ao Brasil!|كي ليغاو! بين ڤيندو آو برازيو!|حلو! أهلا وسهلا بالبرازيل!`,
q:[['كريم من وين؟','من فلسطين','من البرازيل','من مصر'],['شو شغلة كريم؟','طبّاخ','معلم','طبيب'],['أي فعل بنستعمله للتعريف بالنفس؟','ser (eu sou)','estar (eu estou)','ter (eu tenho)']]},
4:{sp:['Vendedor','Samir'],l:`A|Bom dia! Posso ajudar?|بوم دجيا! بوسو أجودار؟|صباح الخير! بقدر أساعدك؟
B|Quanto custa esta camiseta?|كوانتو كوستا إيستا كاميزيتا؟|بكم هاي البلوزة؟
A|Custa trinta e cinco reais.|كوستا ترينتا إي سينكو هياييس.|بخمسة وتلاتين ريال.
B|E aquela azul?|إي أكيلا أزوو؟|وهديك الزرقا؟
A|Aquela custa vinte e oito.|أكيلا كوستا ڤينتشي إي أويتو.|هديك بتمانية وعشرين.
B|Vou levar a azul. Aceita Pix?|ڤو ليڤار آ أزوو. أسيتا بيكس؟|رح آخد الزرقا. بتقبل بيكس؟
A|Aceito, sim. Obrigado!|أسيتو، سين. أوبريغادو!|آه بقبل. شكرًا!`,
q:[['كم سعر البلوزة الأولى؟','35 ريال','28 ريال','25 ريال'],['أي وحدة اشترى؟','الزرقا','الأولى','ولا وحدة'],['كيف دفع؟','بيكس','نقدًا','بطاقة']]},
5:{sp:['Paulo','Nour'],l:`A|Você não é brasileira, né?|ڤوسي ناو إيه برازيليرا، نيه؟|إنتِ مش برازيلية، صح؟
B|Não, eu sou síria. Moro em São Paulo há um ano.|ناو، إيو سو سيريا. مورو إين ساو باولو آ أون آنو.|لا، أنا سورية. ساكنة بساو باولو من سنة.
A|Que línguas você fala?|كي لينغواس ڤوسي فالا؟|شو اللغات اللي بتحكيها؟
B|Falo árabe, inglês e um pouco de português.|فالو آرابي، إينغليس إي أون بوكو دجي بورتوغيس.|بحكي عربي وإنجليزي وشوية برتغالي.
A|Seu português é muito bom!|سيو بورتوغيس إيه مويتو بون!|البرتغالي تبعك منيح كتير!
B|Obrigada! Eu estudo todos os dias.|أوبريغادا! إيو إستودو تودوس أوس دجياس.|شكرًا! بدرس كل يوم.`,
q:[['نور من وين؟','من سوريا','من لبنان','من البرازيل'],['من قديش ساكنة بساو باولو؟','من سنة','من شهر','من خمس سنين'],['أي لغات بتحكي؟','عربي وإنجليزي وشوية برتغالي','برتغالي بس','عربي بس']]},
6:{sp:['Ana','Hassan'],l:`A|Oi, Hassan! Você está bem?|أوي، حسن! ڤوسي إيستا بين؟|هاي حسن! إنت منيح؟
B|Estou cansado. Trabalhei muito hoje.|إيستو كانسادو. ترابالييه مويتو أوجي.|أنا تعبان. اشتغلت كتير اليوم.
A|E seus filhos, como estão?|إي سيوس فيليوس، كومو إيستاو؟|وأولادك كيفهم؟
B|Estão felizes. Hoje é aniversário da minha filha.|إيستاو فيليزيس. أوجي إيه أنيڤيرساريو دا مينيا فيليا.|مبسوطين. اليوم عيد ميلاد بنتي.
A|Que bom! Ela está animada?|كي بون! إيلا إيستا أنيمادا؟|حلو! هي متحمسة؟
B|Muito! Ela está esperando o bolo.|مويتو! إيلا إيستا إسبيراندو أو بولو.|كتير! هي ناطرة الكيكة.`,
q:[['كيف حسن اليوم؟','تعبان','زعلان','مريض'],['شو المناسبة اليوم؟','عيد ميلاد بنته','عرس','أول يوم مدرسة'],['ليش استعملنا estar مش ser؟','لأنه حالة مؤقتة','لأنه صفة دائمة','لأنه مكان ولادة']]},
7:{sp:['Mãe','Filho'],l:`A|Cadê o livro de português?|كاديه أو ليڤرو دجي بورتوغيس؟|وين كتاب البرتغالي؟
B|O livro está na mesa.|أو ليڤرو إيستا نا ميزا.|الكتاب على الطاولة.
A|E as canetas?|إي آس كانيتاس؟|والأقلام؟
B|As canetas estão na mochila.|آس كانيتاس إيستاو نا موشيلا.|الأقلام بالشنطة.
A|Você tem uma prova amanhã?|ڤوسي تين أوما بروڤا أمانيا؟|عندك امتحان بكرة؟
B|Tenho. É uma prova de leitura.|تينيو. إيه أوما بروڤا دجي ليتورا.|آه. امتحان قراءة.
A|Então estude agora, por favor!|إينتاو إيستودجي أغورا، بور فاڤور!|طيب ادرس هلأ لو سمحت!`,
q:[['وين الكتاب؟','على الطاولة','بالشنطة','بالمدرسة'],['ليش بنقول «a mesa» مش «o mesa»؟','لأنه mesa مؤنث','لأنه mesa جمع','لأنه mesa فعل'],['متى الامتحان؟','بكرة','اليوم','بعد أسبوع']]},
8:{sp:['Lúcia','Yusuf'],l:`A|Há quanto tempo você mora aqui?|آ كوانتو تيمبو ڤوسي مورا أكي؟|من قديش ساكن هون؟
B|Há seis meses.|آ سييس ميزيس.|من ست شهور.
A|O que você está fazendo agora?|أو كي ڤوسي إيستا فازيندو أغورا؟|شو عم تعمل هلأ؟
B|Estou estudando português.|إيستو إيستوداندو بورتوغيس.|عم بدرس برتغالي.
A|Por que você estuda português?|بور كي ڤوسي إيستودا بورتوغيس؟|ليش بتدرس برتغالي؟
B|Porque quero trabalhar aqui no Brasil.|بوركي كيرو تراباليار أكي نو برازيو.|لأني بدي أشتغل هون بالبرازيل.`,
q:[['من قديش يوسف ساكن هون؟','من ست شهور','من سنة','من شهرين'],['شو عم يعمل هلأ؟','عم يدرس برتغالي','عم يشتغل','عم ياكل'],['ليش بيدرس برتغالي؟','بده يشتغل بالبرازيل','للسفر','لأنه لازم بالمدرسة']]},
9:{sp:['Carla','Ahmad'],l:`A|Essa foto é da sua família?|إيسا فوتو إيه دا سوا فاميليا؟|هاي صورة عيلتك؟
B|É, sim. Este é meu pai e esta é minha mãe.|إيه، سين. إيستشي إيه ميو باي إي إيستا إيه مينيا ماين.|آه. هاد أبوي وهاي أمي.
A|E quem é esse menino?|إي كين إيه إيسي مينينو؟|ومين هالولد؟
B|É meu filho mais novo. Eu tenho dois filhos.|إيه ميو فيليو مايس نوڤو. إيو تينيو دويس فيليوس.|ابني الصغير. عندي ولدين.
A|Você tem irmãos?|ڤوسي تين إيرماوس؟|عندك إخوة؟
B|Tenho dois irmãos e uma irmã. Eles moram em Beirute.|تينيو دويس إيرماوس إي أوما إيرما. إيليس مورام إين بيروتشي.|عندي أخين وأخت. ساكنين ببيروت.`,
q:[['كم ولد عند أحمد؟','اتنين','تلاتة','أربعة'],['مين الولد اللي بالصورة؟','ابنه الصغير','أخوه','ابن أخوه'],['وين ساكنين إخوته؟','ببيروت','بساو باولو','بساو باولو']]},
10:{sp:['Professor','Aluna'],l:`A|De quem é esta mochila?|دجي كين إيه إيستا موشيلا؟|لمين هاي الشنطة؟
B|É minha, professor.|إيه مينيا، بروفيسور.|إلي يا أستاذ.
A|E esse caderno? É seu também?|إي إيسي كاديرنو؟ إيه سيو تامبين؟|وهالدفتر؟ إلك كمان؟
B|Não, é do Pedro. O caderno dele é azul.|ناو، إيه دو بيدرو. أو كاديرنو ديلي إيه أزوو.|لا، لبيدرو. دفتره أزرق.
A|E as canetas?|إي آس كانيتاس؟|والأقلام؟
B|São nossas. Nós dividimos.|ساو نوساس. نوس دجيڤيدجيموس.|إلنا. منتقاسمهم.`,
q:[['لمين الشنطة؟','للطالبة','لبيدرو','للأستاذ'],['شو يعني «o caderno dele»؟','دفتره','دفتري','دفترها'],['لمين الأقلام؟','إلهم كلهم سوا','للأستاذ','لبيدرو']]},
11:{sp:['Cliente','Vendedora'],l:`A|Quanto custa este pão aqui?|كوانتو كوستا إيستشي باو أكي؟|بكم هالخبز اللي هون؟
B|Este custa oito reais.|إيستشي كوستا أويتو هياييس.|هاد بتمانية ريال.
A|E esse bolo perto de você?|إي إيسي بولو بيرتو دجي ڤوسي؟|وهالكيكة اللي جنبك؟
B|Esse é de chocolate. Custa vinte.|إيسي إيه دجي شوكولاتشي. كوستا ڤينتشي.|هاي بالشوكولاتة. بعشرين.
A|E aqueles doces lá no fundo?|إي أكيليس دوسيس لا نو فوندو؟|وهديك الحلويات اللي هناك ورا؟
B|Aqueles são brigadeiros. São deliciosos!|أكيليس ساو بريغاديروس. ساو ديليسيوزوس!|هدول بريغاديرو. زاكيين كتير!`,
q:[['أي كلمة للشي القريب مني؟','este','esse','aquele'],['بكم الكيكة؟','20 ريال','8 ريال','12 ريال'],['وين الحلويات؟','بعيد، ورا','بإيد الزبون','على الطاولة القريبة']]},
12:{sp:['Policial','Rami'],l:`A|Como é o seu filho?|كومو إيه أو سيو فيليو؟|كيف شكل ابنك؟
B|Ele é baixo e magro. Tem oito anos.|إيلي إيه بايشو إي ماغرو. تين أويتو آنوس.|قصير ونحيف. عمره تمان سنين.
A|Como é o cabelo dele?|كومو إيه أو كابيلو ديلي؟|كيف شعره؟
B|É preto e curto. Os olhos são castanhos.|إيه بريتو إي كورتو. أوس أوليوس ساو كاستانيوس.|أسود وقصير. عيونه بني.
A|Que roupa ele está usando?|كي هوبا إيلي إيستا أوزاندو؟|شو لابس؟
B|Uma camiseta vermelha. Ah, ali está ele!|أوما كاميزيتا ڤيرميليا. آه، آلي إيستا إيلي!|بلوزة حمرا. آه، هيو هناك!`,
q:[['كيف الولد؟','قصير ونحيف','طويل وسمين','طويل ونحيف'],['شو لون شعره؟','أسود','أشقر','بني'],['شو لابس؟','بلوزة حمرا','بلوزة زرقا','جاكيت أسود']]},
13:{sp:['Garçom','Mariam'],l:`A|Boa noite! O que vocês vão pedir?|بوا نويتشي! أو كي ڤوسيس ڤاو بيدجير؟|مسا الخير! شو بدكم تطلبوا؟
B|Eu quero um prato feito com frango, por favor.|إيو كيرو أون براتو فيتو كوم فرانغو، بور فاڤور.|بدي صحن «براتو فيتو» مع جاج لو سمحت.
A|Com arroz, feijão e salada?|كوم أهوز، فيجاو إي سالادا؟|مع رز وفاصوليا وسلطة؟
B|Isso. Tem carne de porco?|إيسو. تين كارني دجي بوركو؟|آه. فيه لحم خنزير؟
A|Não, o frango é grelhado, sem porco.|ناو، أو فرانغو إيه غريليادو، سين بوركو.|لا، الجاج مشوي، بدون خنزير.
B|Ótimo! E um suco de laranja.|أوتشيمو! إي أون سوكو دجي لارانجا.|ممتاز! وعصير برتقان.`,
q:[['شو طلبت مريم؟','براتو فيتو مع جاج','بيتزا','فيجوادا'],['ليش سألت عن الخنزير؟','لأنها ما بتاكله','لأنها بدها إياه','لأنه رخيص'],['شو شربت؟','عصير برتقان','قهوة','مي']]},
14:{sp:['Feirante','Salma'],l:`A|Olha a banana! Olha a laranja fresquinha!|أوليا آ بانانا! أوليا آ لارانجا فريسكينيا!|يلا الموز! يلا البرتقان الطازة!
B|Moço, quanto é a dúzia de banana?|موسو، كوانتو إيه آ دوزيا دجي بانانا؟|يا عمو، بكم دزينة الموز؟
A|Seis reais a dúzia.|سييس هياييس آ دوزيا.|ستة ريال الدزينة.
B|E o quilo de tomate?|إي أو كيلو دجي توماتشي؟|وكيلو البندورة؟
A|Sete reais. Está bem vermelho!|سيتشي هياييس. إيستا بين ڤيرميليو!|بسبعة. أحمر ومستوي!
B|Vou levar uma dúzia de banana e dois quilos de tomate.|ڤو ليڤار أوما دوزيا دجي بانانا إي دويس كيلوس دجي توماتشي.|رح آخد دزينة موز وكيلوين بندورة.`,
q:[['بكم دزينة الموز؟','6 ريال','7 ريال','12 ريال'],['كم كيلو بندورة أخدت؟','اتنين','واحد','تلاتة'],['وين صار الحوار؟','بسوق الخضرة (feira)','بالمطعم','بالصيدلية']]},
15:{sp:['Lucas','Amira'],l:`A|Você quer provar o café brasileiro?|ڤوسي كير بروڤار أو كافيه برازيليرو؟|بدك تجربي القهوة البرازيلية؟
B|Quero! Hum... está muito quente!|كيرو! هم... إيستا مويتو كينتشي!|آه! ممم... سخنة كتير!
A|E o sabor? Está bom?|إي أو سابور؟ إيستا بون؟|والطعمة؟ منيحة؟
B|Está um pouco amargo. Tem açúcar?|إيستا أون بوكو أمارغو. تين أسوكار؟|مرّة شوي. فيه سكر؟
A|Tem. E prove esse doce. É bem doce!|تين. إي بروڤي إيسي دوسي. إيه بين دوسي!|فيه. وجربي هالحلو. حلو كتير!
B|Delicioso! Mas o suco está gelado demais.|ديليسيوزو! ماس أو سوكو إيستا جيلادو دجيمايس.|زاكي! بس العصير بارد زيادة.`,
q:[['كيف كانت القهوة؟','سخنة ومرّة شوي','باردة وحلوة','مالحة'],['شو طلبت للقهوة؟','سكر','حليب','ملح'],['كيف العصير؟','بارد زيادة','سخن','حامض']]},
16:{sp:['Mãe','Filha'],l:`A|Você já tomou café da manhã?|ڤوسي جا تومو كافيه دا مانيا؟|فطرتِ؟
B|Ainda não. Vou comer pão com queijo.|آيندا ناو. ڤو كومير باو كوم كيجو.|لسا. رح آكل خبز مع جبنة.
A|Hoje nós vamos almoçar na casa da vovó.|أوجي نوس ڤاموس آوموسار نا كازا دا ڤوڤو.|اليوم رح نتغدى عند ستك.
B|Que bom! A que horas?|كي بون! آ كي أوراس؟|حلو! الساعة كم؟
A|Ao meio-dia. E à noite a gente janta em casa.|آو ميو دجيا. إي آ نويتشي آ جينتشي جانتا إين كازا.|الضهر. وبالليل منتعشى بالبيت.
B|Combinado! Eu janto cedo, tá?|كومبينادو! إيو جانتو سيدو، تا؟|اتفقنا! أنا بتعشى بكير، ماشي؟`,
q:[['شو رح تفطر البنت؟','خبز مع جبنة','بيض','فواكه'],['وين رح يتغدوا؟','عند الستّ','بالمطعم','بالبيت'],['شو معنى jantar؟','يتعشى','يتغدى','يفطر']]},
17:{sp:['Caixa','Bilal'],l:`A|Encontrou tudo o que precisava?|إينكونترو تودو أو كي بريسيزاڤا؟|لقيت كل اللي بدك إياه؟
B|Quase. Onde fica o leite sem lactose?|كوازي. أوندجي فيكا أو ليتشي سين لاكتوزي؟|تقريبا. وين الحليب الخالي من اللاكتوز؟
A|No corredor três, perto dos ovos.|نو كوهيدور تريس، بيرتو دوس أوڤوس.|بالممر رقم 3، جنب البيض.
B|Obrigado. Quanto ficou tudo?|أوبريغادو. كوانتو فيكو تودو؟|شكرًا. قديش صار الكل؟
A|Ficou oitenta e dois reais. Quer sacola?|فيكو أويتينتا إي دويس هياييس. كير ساكولا؟|صار اتنين وتمانين ريال. بدك كيس؟
B|Não, obrigado. Trouxe a minha.|ناو، أوبريغادو. تروسي آ مينيا.|لا شكرًا. جبت كيسي معي.`,
q:[['وين الحليب؟','بالممر 3 جنب البيض','بالممر 1','عند الصندوق'],['قديش المجموع؟','82 ريال','28 ريال','72 ريال'],['ليش ما أخد كيس؟','جاب كيسه معه','الكيس غالي','ما في أكياس']]},
18:{sp:['Proprietário','Khaled'],l:`A|O apartamento tem dois quartos e uma sala.|أو أبارتاميينتو تين دويس كوارتوس إي أوما سالا.|الشقة فيها غرفتين نوم وصالون.
B|Quanto é o aluguel?|كوانتو إيه أو آلوغيو؟|قديش الإيجار؟
A|Mil e duzentos reais, mais o condomínio.|ميو إي دوزينتوس هياييس، مايس أو كوندومينيو.|ألف ومتين ريال، زائد مصاريف العمارة.
B|Precisa de fiador?|بريسيزا دجي فياضور؟|بدك كفيل؟

33:{sp:['Lucas','Tarek'],l:`A|Você prefere morar numa cidade grande ou pequena?|ڤوسي بريفيري مورار نوما سيدادجي غرانجي أو بيكينا؟|بتفضّل تسكن بمدينة كبيرة ولا صغيرة؟

35:{sp:['Dono da loja','Bilal'],l:`A|Oi, tudo bem? Posso ajudar?|أوي، تودو بين؟ بوسو أجودار؟|هاي، كيفك؟ بقدر أساعدك؟

61:{sp:['Professora','Alunos'],l:`A|Pessoal, é importante vocês chegarem cedo amanhã.|بيسواو، إيه إيمبورتانتشي ڤوسيس شيغارين سيدو أمانيا.|يا جماعة، مهم توصلوا بكير بكرة.
B|Por quê, professora?|بور كيه، بروفيسورا؟|ليش يا معلمة؟
A|Para fazermos a prova oral com calma.|بارا فازيرموس آ بروڤا أوراو كوم كاوما.|حتى نعمل الامتحان الشفهي على مهل.
B|E se a gente se atrasar?|إي سي آ جينتشي سي أتْرازار؟|وإذا تأخرنا؟
A|Antes de entrarem, avisem a secretaria.|أنتشيس دجي إينتراريين، أڤيزين آ سيكريتاريا.|قبل ما تدخلوا، بلّغوا السكرتارية.
B|Combinado. Obrigado por nos avisar!|كومبينادو. أوبريغادو بور نوس أڤيزار!|اتفقنا. شكرًا إنك بلّغتينا!`,
q:[['ليش لازم يوصلوا بكير؟','لامتحان شفهي','لرحلة','لحفلة'],['شو يعملوا إذا تأخروا؟','يبلّغوا السكرتارية','يروّحوا','ولا اشي'],['«chegarem» هي:','مصدر شخصي (infinitivo pessoal)','ماضي','أمر']]},
62:{sp:['Lojista','Cliente'],l:`A|Este é o modelo que o senhor procurava?|إيستشي إيه أو موديلو كي أو سينيور بروكوراڤا؟|هاد الموديل اللي كنت بتدوّر عليه؟
B|Quase. Quero aquele cuja tela é maior.|كوازي. كيرو أكيلي كوجا تيلا إيه مايور.|تقريبًا. بدي هداك اللي شاشته أكبر.
A|Ah, o que está na vitrine?|آه، أو كي إيستا نا ڤيترينِي؟|آه، اللي بالواجهة؟
B|Esse mesmo. A loja onde comprei o último fechou.|إيسي ميزمو. آ لوجا أوندجي كومبريي أو أولتشيمو فيشو.|هاد بالضبط. المحل اللي اشتريت منه آخر مرة سكّر.
A|E a pessoa com quem o senhor falou ontem era eu!|إي آ بيسوا كوم كين أو سينيور فالو أونتين إيرا إيو!|والشخص اللي حكيت معه مبارح كان أنا!
B|Que coincidência! Então já sabe o que eu quero.|كي كوينسيدينسيا! إينتاو جا سابي أو كي إيو كيرو.|يا صدفة! يعني بتعرف شو بدي.`,
q:[['أي موديل بده؟','اللي شاشته أكبر','الأرخص','الأصغر'],['شو صار للمحل القديم؟','سكّر','غلي','بعيد'],['«cuja» بتعني:','اللي إله / تبعه','اللي','وين']]},
63:{sp:['Advogada','Karim'],l:`A|Em que posso ajudar?|إين كي بوسو أجودار؟|كيف بقدر أساعدك؟
B|Preciso de orientação. Gosto do meu trabalho, mas não confio no contrato.|بريسيزو دجي أوريينتاساو. غوستو دو ميو تراباليو، ماس ناو كونفيو نو كونتراتو.|بحتاج استشارة. بحب شغلي، بس ما بثق بالعقد.
A|O senhor já assinou?|أو سينيور جا أسينو؟|وقّعت؟
B|Ainda não. Penso muito nisso.|آيندا ناو. بينسو مويتو نيسو.|لسا. بفكر فيه كتير.
A|Então não se esqueça de trazer o documento amanhã.|إينتاو ناو سي إيسكيسا دجي ترازير أو دوكومينتو أمانيا.|إذن لا تنسى تجيب الورقة بكرة.
B|Pode deixar. Dependo da sua opinião.|بودجي ديشار. ديبيندو دا سوا أوبينياو.|ولا يهمك. بعتمد على رأيك.`,
q:[['شو المشكلة؟','ما بيثق بالعقد','ما بيحب شغله','انطرد'],['وقّع العقد؟','لسا','آه','رفض'],['أي حرف جر بييجي مع confiar؟','em','de','a']]},
64:{sp:['Gerente','Funcionária'],l:`A|Embora esteja cansada, preciso que você fique até as seis.|إينبورا إيستيجا كانسادا، بريسيزو كي ڤوسي فيكي أتيه آس سييس.|رغم إنك تعبانة، بحتاج تضلي لحد الستة.
B|Tudo bem, desde que eu possa sair cedo amanhã.|تودو بين، ديزدجي كي إيو بوسا ساير سيدو أمانيا.|ماشي، بشرط إني أطلع بكير بكرة.
A|Combinado. Caso o cliente ligue, anote tudo.|كومبينادو. كازو أو كليينتشي ليغي، أنوتشي تودو.|اتفقنا. في حال اتصل الزبون، سجّلي كل اشي.
B|Vou anotar para que o senhor entenda o problema.|ڤو أنوتار بارا كي أو سينيور إينتيندا أو بروبليما.|رح سجّل حتى تفهم المشكلة.
A|Ótimo. Mesmo que ele reclame, fique calma.|أوتشيمو. ميزمو كي إيلي هيكلامي، فيكي كاوما.|ممتاز. حتى لو اشتكى، خليكِ هادية.`,
q:[['لحد الساعة كم لازم تضل؟','الستة','الخمسة','التمانية'],['شو شرطها؟','تطلع بكير بكرة','زيادة راتب','إجازة أسبوع'],['أي أداة بتعني «رغم إن»؟','Embora','Caso','Para que']]},
65:{sp:['Coordenador','Analista'],l:`A|Bom dia, time. Qual é o status do projeto?|بوم دجيا، تشيمي. كواو إيه أو إيستاتوس دو بروجيتو؟|صباح الخير يا فريق. شو وضع المشروع؟
B|Estamos dentro do prazo. A entrega é na sexta.|إيستاموس دينترو دو برازو. آ إينتريغا إيه نا سيستا.|ماشيين حسب الوقت. التسليم يوم الجمعة.
A|Ótimo. Alguma pendência?|أوتشيمو. آوغوما بينديينسيا؟|ممتاز. في اشي معلّق؟
B|Falta a aprovação do cliente. Vou alinhar com ele hoje.|فاوتا آ أبروڤاساو دو كليينتشي. ڤو آلينيار كوم إيلي أوجي.|ناقص موافقة الزبون. رح أنسّق معه اليوم.
A|Me dá um retorno até o fim do dia?|مي دا أون هيتورنو أتيه أو فين دو دجيا؟|بتعطيني رد لآخر النهار؟
B|Combinado. Te mando por e-mail.|كومبينادو. تشي ماندو بور إيميل.|اتفقنا. ببعتلك عالإيميل.`,
q:[['متى التسليم؟','الجمعة','الإتنين','آخر الشهر'],['شو ناقص؟','موافقة الزبون','مصاري','موظفين'],['شو معنى «dar um retorno»؟','يعطي رد','يرجع عالبيت','يلف']]},
66:{sp:['Vendedor','Salim'],l:`A|Esse sofá sai por três mil reais.|إيسي سوفا ساي بور تريس ميو هياييس.|هالكنباية بتلاتة آلاف ريال.
B|Está um pouco caro. Tem desconto à vista?|إيستا أون بوكو كارو. تين ديسكونتو آ ڤيستا؟|غالية شوي. في خصم إذا دفعت كاش؟
A|À vista, faço dez por cento.|آ ڤيستا، فاسو ديز بور سينتو.|كاش، بعملك عشرة بالمية.
B|E se eu parcelar em dez vezes?|إي سي إيو بارسيلار إين ديز ڤيزيس؟|وإذا قسّطت على عشر دفعات؟
A|Parcelado fica sem desconto, mas sem juros.|بارسيلادو فيكا سين ديسكونتو، ماس سين جوروس.|بالتقسيط بدون خصم، بس بدون فوايد.
B|Fechado à vista, se o frete for grátis.|فيشادو آ ڤيستا، سي أو فريتشي فور غراتشيس.|اتفقنا كاش، إذا التوصيل ببلاش.`,
q:[['قديش الخصم كاش؟','10%','20%','ما في'],['شو بيصير بالتقسيط؟','بدون خصم وبدون فوايد','مع فوايد','ممنوع'],['شو شرط سليم؟','التوصيل ببلاش','هدية','لون تاني']]},
67:{sp:['Sindicato','Fatima'],l:`A|Qual é a sua dúvida?|كواو إيه آ سوا دوڤيدا؟|شو سؤالك؟
B|Trabalho há um ano com carteira assinada. Tenho direito a férias?|تراباليو آ أون آنو كوم كارتيرا أسينادا. تينيو دجيريتو آ فيرياس؟|بشتغل من سنة بعقد رسمي. إلي حق بإجازة؟
A|Tem. Trinta dias, e recebe um terço a mais.|تين. ترينتا دجياس، إي هيسيبي أون تيرسو آ مايس.|آه. 30 يوم، وبتاخدي تلت زيادة عالراتب.
B|E o décimo terceiro?|إي أو ديسيمو تيرسيرو؟|والراتب التالت عشر؟
A|É pago até dezembro, em duas parcelas.|إيه باغو أتيه ديزيمبرو، إين دواس بارسيلاس.|بينصرف لحد ديسمبر على دفعتين.
B|Ótimo, não sabia disso. Muito obrigada!|أوتشيمو، ناو سابيا دجيسو. مويتو أوبريغادا!|ممتاز، ما كنت بعرف. شكرًا كتير!`,
q:[['قديش مدة الإجازة؟','30 يوم','15 يوم','7 أيام'],['شو بتاخد زيادة بالإجازة؟','تلت الراتب','ولا اشي','نص الراتب'],['متى بينصرف الراتب الـ13؟','لحد ديسمبر على دفعتين','بيناير','كل شهر']]},
68:{sp:['Atendente','Cliente'],l:`A|Central de atendimento, meu nome é Júlia. Em que posso ajudar?|سينتراو دجي أتينجيمينتو، ميو نومي إيه جوليا. إين كي بوسو أجودار؟|خدمة العملاء، معك جوليا. كيف بقدر أساعدك؟
B|Minha internet caiu há dois dias.|مينيا إينتيرنيتشي كاييو آ دويس دجياس.|الإنترنت مقطوع عندي من يومين.
A|Lamento o transtorno. Pode me informar o CPF do titular?|لامينتو أو ترانستورنو. بودجي مي إينفورمار أو سيه بيه إيفي دو تشيتولار؟|آسفة على الإزعاج. بتعطيني CPF صاحب الحساب؟
B|Claro. E vou ter desconto na fatura?|كلارو. إي ڤو تير ديسكونتو نا فاتورا؟|أكيد. ورح يكون في خصم عالفاتورة؟
A|Sim, vamos abater os dias sem serviço.|سين، ڤاموس أباتير أوس دجياس سين سيرڤيسو.|آه، رح نخصم الأيام اللي بدون خدمة.
B|Pode me passar o número do protocolo?|بودجي مي باسار أو نوميرو دو بروتوكولو؟|بتعطيني رقم الطلب؟`,
q:[['شو المشكلة؟','الإنترنت مقطوع','الفاتورة غلط','التلفون خربان'],['هل في خصم؟','آه، على الأيام بدون خدمة','لا','نص الفاتورة'],['شو طلب الزبون بالآخر؟','رقم البروتوكول','مدير','إلغاء']]},
69:{sp:['Ana','Omar'],l:`A|Você viu a notícia de hoje?|ڤوسي ڤيو آ نوتيسيا دجي أوجي؟|شفت خبر اليوم؟
B|Vi. Segundo o jornal, a passagem de ônibus vai aumentar.|ڤي. سيغوندو أو جورناو، آ باساجين دجي أونيبوس ڤاي آومينتار.|شفته. حسب الجريدة، تذكرة الباص رح تغلى.
A|De acordo com a prefeitura, o aumento seria pequeno.|دجي أكوردو كوم آ بريفيتورا، أو آومينتو سيريا بيكينو.|حسب البلدية، الزيادة رح تكون صغيرة.
B|O jornal diz que a decisão teria sido tomada ontem.|أو جورناو دجيز كي آ ديسيزاو تيريا سيدو تومادا أونتين.|الجريدة بتقول إنه القرار يُقال إنه انأخد مبارح.
A|Vamos esperar a confirmação oficial.|ڤاموس إيسبيرار آ كونفيرماساو أوفيسياو.|خلينا نستنى التأكيد الرسمي.`,
q:[['شو الخبر؟','تذكرة الباص رح تغلى','الباصات ببلاش','خط جديد'],['ليش استعملوا «teria sido»؟','لأنه خبر مش مؤكد','لأنه مستقبل','لأنه أمر'],['شو قررت آنا؟','تستنى التأكيد الرسمي','تشتكي','تشتري سيارة']]},
70:{sp:['Assistente social','Mãe'],l:`A|Como posso ajudar a senhora?|كومو بوسو أجودار آ سينيورا؟|كيف بقدر أساعدك؟
B|Quero saber se tenho direito ao Bolsa Família.|كيرو سابير سي تينيو دجيريتو آو بولسا فاميليا.|بدي أعرف إذا إلي حق ببرنامج «بولسا فاميليا».
A|Primeiro, a senhora precisa se inscrever no CadÚnico.|بريميرو، آ سينيورا بريسيزا سي إينسكريڤير نو كادأونيكو.|أول اشي لازم تسجّلي بالـ«كادأونيكو».
B|Quais são os requisitos?|كوايس ساو أوس هيكيزيتوس؟|شو الشروط؟
A|Documentos de todos da família e comprovante de residência.|دوكومينتوس دجي تودوس دا فاميليا إي كومبروڤانتشي دجي هيزيدينسيا.|أوراق كل العيلة وإثبات سكن.
B|E as crianças precisam estar na escola?|إي آس كريانساس بريسيزام إيستار نا إسكولا؟|والأولاد لازم يكونوا بالمدرسة؟
A|Sim, com frequência mínima e vacinas em dia.|سين، كوم فريكوينسيا مينيما إي ڤاسيناس إين دجيا.|آه، بحد أدنى من الحضور وتطعيمات محدّثة.`,
q:[['عن أي برنامج بتسأل؟','بولسا فاميليا','منحة جامعة','قرض'],['شو أول خطوة؟','تسجّل بالكادأونيكو','تفتح حساب','تشتغل'],['شو شرط الأولاد؟','يروحوا عالمدرسة وتطعيماتهم محدّثة','يشتغلوا','ولا اشي']]},
71:{sp:['Vizinho','Hassan'],l:`A|Hassan, aqui no prédio a gente separa o lixo.|حسن، أكي نو بريدجيو آ جينتشي سيبارا أو ليشو.|حسن، هون بالعمارة منفرز الزبالة.
B|Como funciona?|كومو فونسيونا؟|كيف بتمشي؟
A|O lixo reciclável vai no saco verde, e o orgânico no preto.|أو ليشو هيسيكلاڤيو ڤاي نو ساكو ڤيردجي، إي أو أورغانيكو نو بريتو.|الزبالة القابلة للتدوير بالكيس الأخضر، والعضوية بالأسود.
B|E quando o caminhão passa?|إي كواندو أو كامينياو باسا؟|ومتى بتمرق الشاحنة؟
A|O reciclável passa às terças. Tem que reduzir o desperdício também.|أو هيسيكلاڤيو باسا آس تيرساس. تين كي هيدوزير أو ديسبيرديسيو تامبين.|القابلة للتدوير بتمرق يوم التلاتا. ولازم نقلل الهدر كمان.
B|Ótima ideia. Vou ensinar meus filhos.|أوتشيما إيديا. ڤو إينسينار ميوس فيليوس.|فكرة ممتازة. رح علّم ولادي.`,
q:[['وين بيروح القابل للتدوير؟','الكيس الأخضر','الكيس الأسود','بالشارع'],['متى بتمرق شاحنة التدوير؟','التلاتا','الأحد','كل يوم'],['شو رح يعمل حسن؟','يعلّم ولاده','يشتكي','يزت كله سوا']]},
72:{sp:['Moderadora','Debatedor'],l:`A|O tema de hoje: o celular deve ser proibido nas escolas?|أو تيما دجي أوجي: أو سيلولار ديڤي سير بروئيبيدو ناس إسكولاس؟|موضوع اليوم: لازم يتمنع الجوال بالمدارس؟
B|É inegável que o celular distrai os alunos.|إيه إينيغاڤيو كي أو سيلولار دجيستراي أوس آلونوس.|ما في شك إنه الجوال بيلهي الطلاب.
A|Mas há quem diga que ele ajuda na pesquisa.|ماس آ كين دجيغا كي إيلي أجودا نا بيسكيزا.|بس في ناس بتقول إنه بيساعد بالبحث.
B|Em contrapartida, os computadores da escola já cumprem essa função.|إين كونترابارتشيدا، أوس كومبوتادوريس دا إسكولا جا كومبرين إيسا فونساو.|بالمقابل، كمبيوترات المدرسة بتقوم بهالدور.
A|E qual é a sua conclusão?|إي كواو إيه آ سوا كونكلوزاو؟|وشو استنتاجك؟
B|Portanto, defendo o uso apenas com orientação do professor.|بورتانتو، ديفيندو أو أوزو أبيناس كوم أوريينتاساو دو بروفيسور.|لهيك، بأيد الاستعمال بس بتوجيه المعلم.`,
q:[['شو موضوع النقاش؟','منع الجوال بالمدارس','الواجبات','الزي المدرسي'],['شو الحجة المقابلة؟','الجوال بيساعد بالبحث','الجوال غالي','الجوال خطر'],['شو موقفه بالآخر؟','الاستعمال بتوجيه المعلم بس','منع كامل','حرية كاملة']]},
73:{sp:['Colega','Ziad'],l:`A|Ziad, você está esquisito hoje. Aconteceu algo?|زياد، ڤوسي إيستا إيسكيزيتو أوجي. أكونتيسيو آوغو؟|زياد، إنت غريب اليوم. صار اشي؟
B|Pensei que «esquisito» fosse elogio!|بينسيي كي «إيسكيزيتو» فوسي إيلوجيو!|كنت مفكر «esquisito» مدح!
A|Não, quer dizer estranho. Igual a «puxe» na porta, que não é «push».|ناو، كير دجيزير إيسترانيو. إيغواو آ «بوشي» نا بورتا، كي ناو إيه «بوش».|لا، معناها غريب. زي «puxe» عالباب، مش «push».
B|Nossa! Ontem eu empurrei a porta e bati a cara.|نوسا! أونتين إيو إينبوهيي آ بورتا إي باتشي آ كارا.|يا ساتر! مبارح دفشت الباب وانضربت بوجهي.
A|E «pretender» não é fingir, é ter intenção.|إي «بريتينديير» ناو إيه فينجير، إيه تير إينتينساو.|و«pretender» مش يتظاهر، معناها ينوي.
B|Pretendo aprender todos esses falsos amigos!|بريتيندو أبريندير تودوس إيسيس فاوسوس أميغوس!|ناوي أتعلم كل هالكلمات الخادعة!`,
q:[['شو معنى esquisito؟','غريب','لذيذ','رائع'],['شو معنى «puxe» عالباب؟','اسحب','ادفش','اقفل'],['شو معنى pretender؟','ينوي','يتظاهر','يحمي']]},
74:{sp:['Dona Cida','Amira'],l:`A|Entra, querida! Aceita um cafezinho?|إينترا، كيريدا! أسيتا أون كافيزينيو؟|فوتي يا حبيبتي! بتشربي فنجان قهوة؟
B|Aceito! Só um pouquinho, por favor.|أسيتو! سو أون بوكينيو، بور فاڤور.|آه! بس شوية صغيرة لو سمحتِ.
A|Espera um minutinho que vou pegar o bolinho.|إيسبيرا أون مينوتينيو كي ڤو بيغار أو بولينيو.|استني دقيقة صغيرة رح جيب الكيكة الصغيرة.
B|Que casinha linda a senhora tem!|كي كازينيا ليندا آ سينيورا تين!|شو حلو بيتك الصغير!
A|Obrigada! E aquele carrão lá fora é do meu filho.|أوبريغادا! إي أكيلي كاهاو لا فورا إيه دو ميو فيليو.|شكرًا! وهديك السيارة الكبيرة برا لابني.

75:{sp:['Bia','Omar'],l:`A|Omar, você já percebeu que o brasileiro fala diferente em cada região?|أومار، ڤوسي جا بيرسيبيو كي أو برازيليرو فالا دجيفيرينتشي إين كادا هيجياو؟|عمر، لاحظت إن البرازيلي بيحكي غير بكل منطقة؟
B|Percebi! Em Recife ouvi «macaxeira» e em São Paulo «mandioca».|بيرسيبي! إين هيسيفي أوڤي «ماكاشيرا» إي إين ساو باولو «ماندجيوكا».|لاحظت! بريسيفي سمعت «macaxeira» وبساو باولو «mandioca».
A|É a mesma coisa! E no Rio falam «aipim».|إيه آ ميزما كويزا! إي نو هيو فالام «آيبين».|نفس الشي! وبريو بيقولوا «aipim».
B|E com o chefe, uso «você» ou «o senhor»?|إي كوم أو شيفي، أوزو «ڤوسي» أو «أو سينيور»؟|ومع المدير، بستعمل «você» ولا «o senhor»؟
A|No começo, «o senhor». Se ele pedir, aí você muda.|نو كوميسو، «أو سينيور». سي إيلي بيدجير، آي ڤوسي مودا.|بالأول «o senhor». إذا طلب، بتغيّر.
B|Entendi: formal no trabalho, informal com os amigos.|إينتيندجي: فورماو نو ترابالیو، إينفورماو كوم أوس أميغوس.|فهمت: رسمي بالشغل، وعادي مع الأصحاب.`,

76:{sp:['Professora','Bilal'],l:`A|Vamos treinar o ritmo. Repita: «Tô indo pra casa».|ڤاموس ترينار أو هيتمو. هيبيتا: «تو إيندو برا كازا».|خلينا نتدرب عالإيقاع. عيد: «Tô indo pra casa».
B|«Tô indo pra casa.» Parece mais rápido que «estou indo para casa».|«تو إيندو برا كازا.» باريسي مايس هابيدو كي «إيستو إيندو بارا كازا».|بتطلع أسرع من «estou indo para casa».
A|Exatamente. Na fala, «para» vira «pra», «você» vira «cê».|إيزاتامينتشي. نا فالا، «بارا» ڤيرا «برا»، «ڤوسي» ڤيرا «سي».|بالضبط. بالحكي «para» بتصير «pra»، و«você» بتصير «cê».
B|E «está» vira «tá»?|إي «إيستا» ڤيرا «تا»؟|و«está» بتصير «tá»؟
A|Isso! Mas na escrita formal, use a forma completa.|إيسو! ماس نا إيسكريتا فورماو، أوزي آ فورما كومبليتا.|صح! بس بالكتابة الرسمية استعمل الشكل الكامل.
B|Entendi: falar solto, escrever certinho.|إينتيندجي: فالار سولتو، إيسكريڤير سيرتشينيو.|فهمت: أحكي بعفوية، وأكتب مضبوط.`,

77:{sp:['Diretora','Consultor'],l:`A|A expansão é cara; não obstante, é necessária.|آ إيسبانساو إيه كارا؛ ناو أوبستانتشي، إيه نيسيساريا.|التوسع مكلف؛ ومع ذلك، هو ضروري.

A|Além disso, precisamos contratar dez pessoas.|آلين دجيسو، بريسيزاموس كونتراتار ديز بيسواس.|بالإضافة لذلك، لازم نوظف عشر أشخاص.

78:{sp:['Revisor','Autor'],l:`A|Aqui você escreveu «Me diga a verdade» no início do texto formal.|أكي ڤوسي إيسكريڤيو «مي دجيغا آ ڤيرداجي» نو إينيسيو دو تيكستو فورماو.|هون كتبت «Me diga a verdade» ببداية نص رسمي.
B|Está errado?|إيستا إيهادو؟|غلط؟
A|Na fala é normal. Na escrita formal, prefira «Diga-me a verdade».|نا فالا إيه نورماو. نا إيسكريتا فورماو، بريفيرا «دجيغا مي آ ڤيرداجي».|بالحكي عادي. بالكتابة الرسمية الأفضل «Diga-me a verdade».

79:{sp:['Aluna','Professor'],l:`A|Professor, «Vou à escola» tem crase?|بروفيسور، «ڤو آ إيسكولا» تين كرازي؟|أستاذ، «Vou à escola» فيها crase؟
B|Tem. «Ir a» mais «a escola» vira «à».|تين. «إير آ» مايس «آ إيسكولا» ڤيرا «آ».|آه. «ir a» زائد «a escola» بتصير «à».

80:{sp:['Professora','Aluno'],l:`A|Por que você não fez a tarefa?|بور كي ڤوسي ناو فيز آ تاريفا؟|ليش ما عملت الواجب؟

A|Repare: na pergunta, «por que» separado; na resposta, «porque» junto.|هيباري: نا بيرغونتا، «بور كي» سيبارادو؛ نا هيسبوستا، «بوركي» جونتو.|انتبه: بالسؤال «por que» منفصلة؛ وبالجواب «porque» متصلة.

81:{sp:['Servidora','Requerente'],l:`A|O senhor precisa protocolar um requerimento.|أو سينيور بريسيزا بروتوكولار أون هيكيريمينتو.|لازم تقدّم طلب رسمي.

82:{sp:['Advogado','Cliente'],l:`A|O senhor recebeu uma intimação para a audiência.|أو سينيور هيسيبيو أوما إينتيماساو بارا آ آوجيينسيا.|وصلك تبليغ لجلسة المحكمة.
B|Isso é grave? Eu sou o réu?|إيسو إيه غراڤي؟ إيو سو أو هيو؟|هاد خطير؟ أنا المدّعى عليه؟

B|Preciso levar algum documento?|بريسيزو ليڤار آوغون دوكومينتو؟|لازم أجيب ورقة؟

83:{sp:['Orientadora','Mestrando'],l:`A|Qual é o objetivo da sua pesquisa?|كواو إيه أو أوبجيتشيڤو دا سوا بيسكيزا؟|شو هدف بحثك؟
B|O presente trabalho tem como objetivo analisar o uso de IA no marketing.|أو بريزينتشي تراباليو تين كومو أوبجيتشيڤو أناليزار أو أوزو دجي إي آ نو ماركيتشينغ.|يهدف هذا العمل إلى تحليل استخدام الذكاء الاصطناعي بالتسويق.
A|E a metodologia?|إي آ ميتودولوجيا؟|والمنهجية؟
B|Trata-se de uma pesquisa qualitativa, com entrevistas.|تراتا سي دجي أوما بيسكيزا كواليتاتشيڤا، كوم إينتريڤيستاس.|هو بحث نوعي، مع مقابلات.

84:{sp:['Editor','Redatora'],l:`A|Neste anúncio, evite «eu» e «nós».|نيستشي أنونسيو، إيڤيتي «إيو» إي «نوس».|بهالإعلان، تجنّبي «أنا» و«إحنا».
B|Então escrevo «Vendem-se apartamentos»?|إينتاو إيسكريڤو «ڤيندين سي أبارتاميينتوس»؟|يعني بكتب «تُباع شقق»؟
A|Isso. E «Precisa-se de vendedores».|إيسو. إي «بريسيزا سي دجي ڤينديدوريس».|صح. و«مطلوب بائعين».

85:{sp:['Avó','Neto'],l:`A|Não desanime! Devagar se vai ao longe.|ناو ديزانيمي! ديڤاغار سي ڤاي آو لونجي.|لا تيأس! على مهلك بتوصل بعيد.
B|Mas eu não tenho computador para estudar.|ماس إيو ناو تينيو كومبوتادور بارا إيستودار.|بس ما عندي كمبيوتر أدرس عليه.

86:{sp:['Gestor','Equipe'],l:`A|Pessoal, o prazo é curto. Vamos botar a mão na massa!|بيسواو، أو برازو إيه كورتو. ڤاموس بوتار آ ماو نا ماسا!|يا جماعة، الوقت قصير. يلا نشمّر عن إيدينا!

87:{sp:['Colega','Khaled'],l:`A|Khaled, adorei sua apresentação. Depois a gente marca um café!|خالد، أدوريي سوا أبريزينتاساو. ديبويس آ جينتشي ماركا أون كافيه!|خالد، عجبني عرضك كتير. بعدين منتفق عالقهوة!

B|(pensando) «Vamos ver»... no Brasil isso pode ser um «não» educado.|(بينساندو) «ڤاموس ڤير»... نو برازيو إيسو بودجي سير أون «ناو» إيدوكادو.|(بيفكر) «منشوف»... بالبرازيل ممكن تكون «لا» مؤدبة.

89:{sp:['Professora','Aluno'],l:`A|Espero que você tenha gostado da aula.|إيسبيرو كي ڤوسي تينيا غوستادو دا آولا.|بتمنى تكون عجبتك الحصة.

A|É o pretérito perfeito do subjuntivo. Outro exemplo: «Talvez ele já tenha saído».|إيه أو بريتيريتو بيرفيتو دو سوبجونتشيڤو. أوترو إيزيمبلو: «تاوڤيز إيلي جا تينيا سايدو».|هاد الماضي التام بصيغة الشك. مثال تاني: «يمكن يكون طلع».

90:{sp:['Estrangeiro','Brasileira'],l:`A|Onde fica o banco mais próximo?|أوندجي فيكا أو بانكو مايس بروسيمو؟|وين أقرب بنك؟
B|Fica a duas quadras. Mas hoje não deu certo para mim, estava fechado.|فيكا آ دواس كوادراس. ماس أوجي ناو ديو سيرتو بارا مين، إيستاڤا فيشادو.|على بعد شارعين. بس اليوم ما زبط معي، كان مسكّر.

91:{sp:['Jornalista','Economista'],l:`A|A inflação subiu no último mês. O que isso significa para as famílias?|آ إينفلاساو سوبيو نو أولتشيمو ميس. أو كي إيسو سيغنيفيكا بارا آس فاميلياس؟|التضخم ارتفع الشهر الماضي. شو بيعني هاد للعائلات؟

92:{sp:['Samir','Investidora'],l:`A|Obrigado pelo seu tempo. Vou apresentar a nossa agência em dois minutos.|أوبريغادو بيلو سيو تيمبو. ڤو أبريزينتار آ نوسا أجينسيا إين دويس مينوتوس.|شكرًا على وقتك. رح أعرض وكالتنا بدقيقتين.

B|Interessante. Me mande uma proposta por escrito.|إينتيريسانتشي. مي ماندي أوما بروبوستا بور إيسكريتو.|مثير للاهتمام. ابعتلي عرض مكتوب.`,

93:{sp:['Júlia','Karim'],l:`A|Karim, você está quieto hoje. Aconteceu alguma coisa?|كريم، ڤوسي إيستا كيتو أوجي. أكونتيسيو آوغوما كويزا؟|كريم، إنت ساكت اليوم. صار اشي؟

A|Imagino como deve ser difícil. Quer desabafar?|إيماجينو كومو ديڤي سير دجيفيسيو. كير دجيزابافار؟|متخيّلة قديش صعب. بدك تفضفض؟

B|Obrigado, Júlia. Já me sinto mais aliviado.|أوبريغادو، جوليا. جا مي سينتو مايس آليڤيادو.|شكرًا جوليا. صرت مرتاح أكتر.`,

94:{sp:['Paulo','Nour'],l:`A|Nour, você não me mandou o arquivo ontem!|نور، ڤوسي ناو مي ماندو أو أركيڤو أونتين!|نور، ما بعتيلي الملف مبارح!

A|Ah, eu estava esperando pelo WhatsApp. Desculpa, falei sem pensar.|آه، إيو إيستاڤا إيسبيراندو بيلو واتساب. دجيسكولبا، فاليي سين بينسار.|آه، كنت مستني عالواتساب. آسف، حكيت بدون ما فكّر.
B|Tudo bem, não foi sua intenção. Da próxima vez eu mando nos dois.|تودو بين، ناو فوي سوا إينتينساو. دا بروسيما ڤيز إيو ماندو نوس دويس.|ولا يهمك، ما كان قصدك. المرة الجاية ببعته عالاتنين.

B|Claro que está! Já passou.|كلارو كي إيستا! جا باسو.|أكيد! خلصت.`,

95:{sp:['Atendente','Nabil'],l:`A|Boa tarde! Tem reserva?|بوا تاردجي! تين هيزيرڤا؟|مساء الخير! عندك حجز؟
B|Tenho, em nome de Nabil Haddad, para três noites.|تينيو، إين نومي دجي نبيل حداد، بارا تريس نويتشيس.|آه، باسم نبيل حداد، لتلات ليالي.

96:{sp:['Gerente','Layla'],l:`A|...e por isso, vamos mudar o horário de atendimento.|...إي بور إيسو، ڤاموس مودار أو أوراريو دجي أتينجيمينتو.|...ولهيك رح نغيّر ساعات الدوام.

97:{sp:['Thiago','Omar'],l:`A|Omar, sabe por que o livro de matemática está triste?|عمر، سابي بور كي أو ليڤرو دجي ماتيماتشيكا إيستا تريستشي؟|عمر، بتعرف ليش كتاب الرياضيات زعلان؟

A|Isso! «Problema» é dificuldade e também exercício.|إيسو! «بروبليما» إيه دجيفيكولدادجي إي تامبين إيزيرسيسيو.|بالضبط! «problema» يعني مشكلة وكمان مسألة.
B|Agora eu entendo piada em português. Que conquista!|أغورا إيو إينتيندو بيادا إين بورتوغيس. كي كونكيستا!|هلأ صرت أفهم النكت بالبرتغالي. شو هالإنجاز!`,

98:{sp:['Mestre de cerimônias','Fadi'],l:`A|Agora, convido o Fadi para dizer algumas palavras.|أغورا، كونڤيدو أو فادي بارا دجيزير آوغوماس بالاڤراس.|هلأ بدعي فادي يحكي كلمتين.
B|Boa noite a todos e obrigado pela presença. É uma honra estar aqui.|بوا نويتشي آ تودوس إي أوبريغادو بيلا بريزينسا. إيه أوما أونرا إيستار أكي.|مساء الخير للجميع وشكرًا على حضوركم. شرف إلي كون هون.

B|Para concluir, deixo uma mensagem: nunca desistam de aprender.|بارا كونكلوير، ديشو أوما مينساجين: نونكا دجيزيستان دجي أبريندير.|وللختام، بترك رسالة: لا تستسلموا أبدًا عن التعلّم.
A|Uma salva de palmas para o Fadi!|أوما ساوڤا دجي باوماس بارا أو فادي!|تصفيق لفادي!`,

99:{sp:['RH','Huda'],l:`A|Gostaríamos de oferecer a vaga a você. O salário é de quatro mil reais brutos.|غوستاريياموس دجي أوفيريسير آ ڤاغا آ ڤوسي. أو سالاريو إيه دجي كواترو ميو هياييس بروتوس.|بنحب نعرض عليكِ الوظيفة. الراتب أربعة آلاف ريال إجمالي.

function vBasic(id){
  const LST=BG.some(x=>x.id===id)?BG:BT;const i=LST.findIndex(x=>x.id===id),t=LST[i];if(!t)return vBasics();
  const nx=LST[i+1]||(LST===BT?BG[0]:null);const gram=LST===BG;
  const show=()=>{app.innerHTML=`<div class="stack"><div class="ch-head"><span class="eyebrow">${gram?'القواعد الأساسية':'الأساسيات'} · الباب ${i+1} من ${LST.length}</span><h1 style="font-size:24px">${t.ic} ${esc(t.t)}</h1><span class="muted">${esc(t.s)}</span></div>
   <div class="card lesson">${Pp(t.intro)}${X(t.r)}${t.tip?TIP(t.tip):''}</div>
   <div class="row"><button class="btn primary" id="bq">تمرين: ${gram?t.D.length+2:Math.min(8,t.R.length)} أسئلة</button>${nx?`<a class="btn" href="#basic-${nx.id}">التالي: ${esc(nx.t)} ←</a>`:''}</div></div>`;
    $('#bq').onclick=quiz};
  const quiz=()=>{app.innerHTML=`<div id="qb"></div>`;const pool=t.R;const qs=gram?shuffle(t.D.map(drillQ).concat(shuffle(pool).slice(0,2).map((w,n)=>n?qListen(w,pool):qPt2Ar(w,pool)))):shuffle(pool).slice(0,Math.min(8,pool.length)).map((w,n)=>n%3===0?qPt2Ar(w,pool):n%3===1?qAr2Pt(w,pool):qListen(w,pool));
    runQuiz($('#qb'),qs,{title:t.t,retry:quiz,onDone:p=>{S.bs=S.bs||{};if(S.bs[id]==null||p>S.bs[id]){S.bs[id]=p;save()}},next:nx?{label:'التالي: '+nx.t+' ←',href:'#basic-'+nx.id}:{label:'الرجوع إلى الأساسيات',href:'#basics'}})};
  show();
}

/* ===== قسم الأطفال ===== */
// كل عنصر: البرتغالي|النطق|العربي|عنوان صورة ويكيبيديا (إنجليزي)|إيموجي احتياطي
/* --- صور حقيقية: ويكيبيديا، وإذا ما في صورة بندوّر بويكيميديا كومنز (مع تخزين مؤقت) --- */
const KIMG=(()=>{try{return JSON.parse(localStorage.getItem('kimg3')||'{}')}catch(e){return {}}})();
const kSave=()=>{try{localStorage.setItem('kimg3',JSON.stringify(KIMG))}catch(e){}};
async function wikiThumb(title){const u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=480&titles='+encodeURIComponent(title);
  const j=await (await fetch(u)).json();const p=Object.values((j.query&&j.query.pages)||{})[0];const s=p&&p.thumbnail&&p.thumbnail.source;return s&&!/\.svg/i.test(s)?s:''}
async function commonsThumb(q){const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|mime&iiurlwidth=480&gsrsearch='+encodeURIComponent('filetype:bitmap '+q);
  const j=await (await fetch(u)).json();const ps=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>(a.index||0)-(b.index||0));
  for(const p of ps){const ii=p.imageinfo&&p.imageinfo[0];if(ii&&/jpe?g|png|webp/i.test(ii.mime||'')&&ii.thumburl)return ii.thumburl}return ''}
async function wikiImg(spec){
  if(KIMG[spec])return KIMG[spec];
  const [title,q]=spec.split('?');let u='';
  try{if(title)u=await wikiThumb(title)}catch(e){}
  if(!u&&(q||title)){try{u=await commonsThumb(q||title)}catch(e){}}
  if(u){KIMG[spec]=u;kSave()}return u;
}
function kidPic(k,it,big){
  if(k.color)return `<span class="kpic kcol" style="background:${it.img}"></span>`;
  if(k.num)return `<span class="kpic knum">${+it.img<=10?'⭐'.repeat(+it.img):'<span class="kn-e">'+it.em+'</span>'}<b>${it.img}</b></span>`;
  if(k.phrase||k.emo||!it.img||it.img==='-')return `<span class="kpic kemo">${it.em}</span>`;
  return `<span class="kpic kimg" data-wiki="${esc(it.img)}"><span class="kemo">${it.em}</span></span>`;
}
function hydrateKidPics(root){
  $$('[data-wiki]',root).forEach(async el=>{const u=await wikiImg(el.dataset.wiki);if(u&&el.isConnected){const im=new Image();im.alt='';im.loading='lazy';im.referrerPolicy='no-referrer';im.onload=()=>{el.innerHTML='';el.appendChild(im);el.classList.add('loaded')};im.src=u}});
}

const KPREV=3;
const kLearned=key=>!!((S.kidW||{})[key]);
const kDone=k=>kStars(k.id)>=2&&(!k.F.length||kStars(k.id+'_f')>=2);
const kOpen=k=>{if(canSkip()||kDone(k))return true;let free=KPREV;for(const x of KIDS.slice().sort((a,b)=>a.ord-b.ord)){if(kDone(x))continue;if(x===k)return true;if(--free<=0)return false}return false};
const kPct=k=>{const all=k.L.concat(k.F);return all.length?Math.round(all.filter(x=>kLearned(x.key)).length/all.length*100):0};

/* صوت فرح: نغمة حلوة + تصفيق، مولّد كملف WAV (بيشتغل حتى لو الجهاز على الصامت لأنه صوت ميديا) */
let KWAV=null;
function makeCheerWav(){const sr=22050,dur=1.25,N=Math.floor(sr*dur),d=new Float32Array(N);
  [[0,1046.5],[0.09,1318.5],[0.18,1568],[0.27,2093]].forEach(([t0,f])=>{const s0=Math.floor(t0*sr);for(let n=0;n<sr*0.45&&s0+n<N;n++){const t=n/sr;d[s0+n]+=0.22*Math.sin(2*Math.PI*f*t)*Math.exp(-t*7)+0.06*Math.sin(2*Math.PI*f*2*t)*Math.exp(-t*10)}});
  for(let c=0;c<8;c++){const s0=Math.floor((0.32+c*0.105+Math.random()*0.03)*sr);let lp=0;for(let n=0;n<sr*0.05&&s0+n<N;n++){const w=(Math.random()*2-1);lp=lp*0.35+w*0.65;d[s0+n]+=0.55*(w-lp)*Math.pow(1-n/(sr*0.05),2.5)}}
  const buf=new ArrayBuffer(44+N*2),v=new DataView(buf);const ws=(o,s)=>{for(let q=0;q<s.length;q++)v.setUint8(o+q,s.charCodeAt(q))};
  ws(0,'RIFF');v.setUint32(4,36+N*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,N*2,true);
  for(let n=0;n<N;n++){const x=Math.max(-1,Math.min(1,d[n]));v.setInt16(44+n*2,x*32767,true)}
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}))}
let KCHEER_EL=null;
function clap(){try{try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  KWAV=KWAV||makeCheerWav();KCHEER_EL=KCHEER_EL||new Audio();KCHEER_EL.src=KWAV;KCHEER_EL.currentTime=0;KCHEER_EL.volume=1;const p=KCHEER_EL.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function confetti(n=60){const box=document.createElement('div');box.className='confetti';const em=['🎉','⭐','🎈','✨','💛','🌈'];
  for(let j=0;j<n;j++){const s=document.createElement('i');s.textContent=Math.random()<.35?em[j%em.length]:'';s.style.left=Math.random()*100+'vw';s.style.background=s.textContent?'transparent':`hsl(${Math.random()*360},90%,60%)`;s.style.animationDelay=(Math.random()*.6)+'s';s.style.animationDuration=(1.6+Math.random()*1.4)+'s';box.appendChild(s)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3600)}

function gameMenu(el,words,sents,onPlayed){

    $$('.gcard',el).forEach(b=>b.onclick=()=>play(b.dataset.g))};
  const play=k=>{clearTimers();const done=(sc,detail)=>{clearTimers();const best=S.best[k]??-1;if(sc>best)S.best[k]=sc;addXP(sc/10);if(onPlayed)onPlayed(sc);
      el.innerHTML=`<div class="result"><div class="ring" style="--p:${Math.min(100,k==='speed'?sc*5:sc)};--c:var(--green)"><b>${sc}</b></div><h2>${k==='speed'?'جواب صح':'نقطة'}</h2><p class="muted" style="margin:0">${esc(detail)}${sc>best&&best>=0?' · رقم قياسي جديد!':''}</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">العب كمان</button><button class="btn" id="menu">ألعاب ثانية</button></div></div>`;

function gMatch(el,words,done){

  const round=()=>{const set=pick(words,Math.min(5,words.length));const L=shuffle(set.map((w,k)=>({k,x:w.pt}))),R=shuffle(set.map((w,k)=>({k,x:w.ar})));let sel=null,left=set.length;
    el.innerHTML=`<div class="ghead"><span>مطابقة · الجولة ${r+1} من ${rounds}</span><span>أغلاط: <b id="mm">${mist}</b></span></div><div class="match"><div class="col">${L.map(x=>`<button class="mt pt" data-s="L" data-k="${x.k}" lang="pt-BR" dir="ltr">${esc(x.x)}</button>`).join('')}</div><div class="col">${R.map(x=>`<button class="mt" data-s="R" data-k="${x.k}">${esc(x.x)}</button>`).join('')}</div></div>`;
    $$('.mt',el).forEach(b=>b.onclick=()=>{if(b.disabled)return;if(b.dataset.s==='L')say(b.textContent);

      else{mist++;$('#mm',el).textContent=mist;const a=sel,c=b;[a,c].forEach(x=>{x.classList.remove('sel');x.classList.add('shake')});TIMERS.push(setTimeout(()=>[a,c].forEach(x=>x.classList.remove('shake')),400));sel=null}})};

function gListen(el,words,done){
  const qs=pick(words,Math.min(8,words.length));let i=0,ok=0;const noA=!audioOK();

    $$('.opt',el).forEach(b=>b.onclick=()=>{const k=+b.dataset.k;$$('.opt',el).forEach(x=>x.disabled=true);$$('.opt',el)[a].classList.add('right');if(k===a)ok++;else b.classList.add('wrong');const fb=$('#fb',el);fb.className='fb show '+(k===a?'ok':'bad');fb.innerHTML=`${k===a?'صح!':'الكلمة كانت:'}<span class="ans" lang="pt-BR" dir="ltr">${esc(w.pt)}</span><span class="pron">${esc(w.pron||'')}</span>`;TIMERS.push(setTimeout(()=>{i++;i<qs.length?show():done(Math.round(ok/qs.length*100),`${ok} من ${qs.length} صح`)},1500))});

function gScr(el,sents,done){

  const next=()=>{if(i>=qs.length)return done(Math.round(ok/qs.length*100),`${ok} من ${qs.length} جمل صح`);
    runQuiz(el,[Q.scr(qs[i].ar,qs[i].pt)],{title:`رتّب الجملة · ${i+1} من ${qs.length}`,raw:c=>{ok+=c;i++;next()}})};

function gSpeed(el,words,done){
  let left=45,ok=0,bad=0,cur;
  const nextPair=()=>{const w=words[Math.floor(Math.random()*words.length)];const truth=Math.random()<.5;let ar=w.ar;if(!truth){const o=words.filter(x=>x.ar!==w.ar);ar=o[Math.floor(Math.random()*o.length)].ar}cur={w,ar,truth:ar===w.ar};
    $('#pp',el).innerHTML=`${P(w.pt)}<span class="ar">${esc(ar)}</span>`};
  el.innerHTML=`<div class="tf"><div class="ghead" style="width:100%"><span>صح ولا غلط</span><span class="timer" id="tm">45</span></div><div class="pair" id="pp"></div><div class="btns"><button class="yes" id="yes">صح</button><button class="no" id="no">غلط</button></div><p class="muted" style="margin:0">صح: <b id="okc">0</b> · غلط: <b id="bdc">0</b></p></div>`;
  const ans=v=>{if(left<=0)return;if(v===cur.truth)ok++;else bad++;$('#okc',el).textContent=ok;$('#bdc',el).textContent=bad;const pp=$('#pp',el);pp.style.background=v===cur.truth?'var(--ok-soft)':'var(--bad-soft)';TIMERS.push(setTimeout(()=>{pp.style.background=''},180));nextPair()};

const dayNum=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const BOXES=[1,3,7,14,30];
const WMAP=new Map(),SMAP=new Map(),DMAP=new Map();
function buildMaps(){CH.forEach(c=>{c.W.forEach(w=>WMAP.set(w.key,w));c.S.forEach(s=>SMAP.set(s.key,s));c.D.forEach(d=>DMAP.set('d|'+d[0],{d,ch:c.id}))});}
function srsRecord(q,credit){if(!q||!q.key)return;S.srs=S.srs||{};const it=S.srs[q.key];
  if(credit<1)S.srs[q.key]={b:0,due:dayNum()+1};
  else if(it){const b=it.b+1;if(b>=BOXES.length)delete S.srs[q.key];else S.srs[q.key]={b,due:dayNum()+BOXES[b]}}}
const keyCh=k=>{const x=WMAP.get(k)||SMAP.get(k)||DMAP.get(k);return x?x.ch:0};
/* المراجعة بس من أغلاط فصول أخذ فيها أقل من 100٪ */
const srsOK=k=>{const c=keyCh(k);if(!c)return false;const s=S.ch[c];return !!(s&&s.quiz!=null&&s.quiz<100)};
const srsDue=()=>Object.entries(S.srs||{}).filter(([k,v])=>v.due<=dayNum()&&srsOK(k));
const srsTotal=()=>Object.keys(S.srs||{}).filter(srsOK).length;
function reviewQs(){const due=shuffle(srsDue()).slice(0,15);const W=allWords(),Sx=allSents();
  return due.map(([k])=>{
    if(WMAP.has(k)){const w=WMAP.get(k);const r=Math.random();const q=r<.3?qPt2Ar(w,W):r<.55?qAr2Pt(w,W):r<.8?qListen(w,W):Q.type(w.ar,w.pt);q.key=k;return q}
    if(SMAP.has(k)){const s=SMAP.get(k);const r=Math.random();const q=r<.35?Q.scr(s.ar,s.pt):r<.7?qS2Ar(s,Sx):qDict(s);q.key=k;return q}
    const q=drillQ(DMAP.get(k).d);return q});
}

function compareSpeech(target,heard){const T=nrm(target).split(' ').filter(Boolean),H=nrm(heard).split(' ').filter(Boolean);
  const m=T.length,n=H.length;const L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=T[i]===H[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ok=new Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(T[i]===H[j]){ok[i]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  return{ok,score:m?ok.filter(Boolean).length/m:0}}
