/* ---------- 1) تقييم النطق: تعرّف على الصوت بالمتصفح (أو تسجيل + ذكاء اصطناعي) بنفس واجهة DICT ---------- */
function makeWebDict(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const H={p:[],f:[],s:[]};let rec=null,on=false;
  const emit=(k,e)=>H[k].forEach(f=>{try{f(e)}catch(_){}});
  if(SR){return {kind:'web',onPartial:f=>H.p.push(f),onFinal:f=>H.f.push(f),onState:f=>H.s.push(f),
    start(){return new Promise((res,rej)=>{try{rec=new SR();rec.lang='pt-BR';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
      rec.onstart=()=>{on=true;emit('s',{state:'listening'});res()};
      rec.onresult=ev=>{let fin='',part='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else part+=r[0].transcript}if(part)emit('p',{text:part});if(fin)emit('f',{text:fin})};
      rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){rej({code:'not_granted'})}};
      rec.onend=()=>{on=false;emit('s',{state:'idle',reason:'ended'})};rec.start()}catch(e){rej(e)}})},
    stop(){try{rec&&rec.stop()}catch(e){}return Promise.resolve()}}}
  if(typeof IS_PWA!=='undefined'&&IS_PWA&&navigator.mediaDevices&&window.MediaRecorder){let mr=null,chunks=[],stream=null;
    return {kind:'ai',onPartial:f=>H.p.push(f),onFinal:f=>H.f.push(f),onState:f=>H.s.push(f),
      async start(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){throw {code:'not_granted'}}
        const mt=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
        chunks=[];mr=new MediaRecorder(stream,mt?{mimeType:mt}:{});mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
        mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());emit('p',{text:'⏳ عم أسمع التسجيل…'});
          try{const s=await claude.use('sample');const t=await s.transcribe(new Blob(chunks,{type:mr.mimeType||mt||'audio/mp4'}));emit('f',{text:t||''})}catch(e){toast('ما قدرت أقيّم التسجيل هلأ.')}
          emit('s',{state:'idle',reason:'ended'})};
        mr.start();emit('s',{state:'listening'})},
      stop(){try{mr&&mr.state==='recording'&&mr.stop()}catch(e){}return Promise.resolve()}}}
  return null;
}
(function(){setTimeout(()=>{if(typeof DICT!=='undefined'&&!DICT){const d=makeWebDict();if(d){DICT=d;DICT.onPartial(e=>dictHandler&&dictHandler('partial',e));DICT.onFinal(e=>dictHandler&&dictHandler('final',e));DICT.onState(e=>dictHandler&&dictHandler('state',e))}}},2500)})();

  const p=n=>String(n).padStart(2,'0');const dt=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(h)}${p(m)}00`;
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Portugues com Said//PT','BEGIN:VEVENT','UID:pcs-daily-'+Date.now()+'@portuguescomsaid','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z','DTSTART:'+dt,'DURATION:PT'+goalMin()+'M','RRULE:FREQ=DAILY',
    'SUMMARY:🇧🇷 وقت البرتغالي ('+goalMin()+' دقايق)','DESCRIPTION:افتح التطبيق: https://portuguescomsaid.github.io','URL:https://portuguescomsaid.github.io','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:وقت البرتغالي!','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='portugues-tذكير.ics'.replace('tذكير','reminder');document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500)}
function vGoal(){
  const g=goalMin(),days=lastDays(7).reverse(),mx=Math.max(g*60,...days.map(k=>(S.days||{})[k]||0));
  app.innerHTML=`<div class="stack"><div><h1 style="font-size:24px;margin:0">🎯 هدفي اليومي</h1><p class="muted" style="margin:4px 0 0">قديش بدك تدرس كل يوم؟ الدراسة القليلة كل يوم أحسن من كتير مرة بالأسبوع.</p></div>
   <div class="goal-opts">${[[5,'خفيف','☕'],[10,'عادي','📘'],[15,'جدّي','💪'],[20,'مكثّف','🔥'],[30,'بطل','🏆']].map(([m,l,ic])=>`<button class="goal-o${g===m?' on':''}" data-g="${m}"><span>${ic}</span><b>${m} دقايق</b><small>${l}</small></button>`).join('')}</div>
   <section class="card"><h2 class="adm-h">آخر 7 أيام</h2><div class="adm-chart">${days.map(k=>{const v=Math.round(((S.days||{})[k]||0)/60);return `<div class="adm-col"><em>${v||''}</em><i style="height:${Math.round(((S.days||{})[k]||0)/mx*100)}%;background:${v>=g?'var(--ok)':'var(--sun)'}"></i><small>${k.split('-')[2]}</small></div>`}).join('')}</div><p class="muted" style="margin:6px 0 0;font-size:13px">الأخضر: يوم حقّقت فيه الهدف.</p></section>
   <section class="card stack"><h2 class="adm-h">⏰ تذكير يومي</h2><p class="muted" style="margin:0">اختار الساعة، وبينضاف تذكير يومي على تقويم جوالك (بيشتغل حتى لو التطبيق مسكّر).</p>
    <div class="row"><input type="time" id="rt" class="sel" value="${S.remind||'19:00'}" style="max-width:150px"><button class="btn primary" id="rset">➕ أضف التذكير للتقويم</button></div>
    <p class="muted" style="margin:0;font-size:13px">بالآيفون: بيفتح ملف التقويم ← اضغط «إضافة الكل». بالأندرويد: افتح الملف بتطبيق التقويم.</p></section></div>`;
  $$('[data-g]').forEach(b=>b.onclick=()=>{S.goal=+b.dataset.g;S.goalDone='';save();vGoal();toast('هدفك صار '+S.goal+' دقايق باليوم')});
  $('#rset').onclick=()=>{S.remind=$('#rt').value||'19:00';save();icsReminder(S.remind)};
}

/* ---------- 4) الدوري الأسبوعي 🏆 (الاسم الأول بس) ---------- */
function weekKey(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
(function(){const _add=addXP;addXP=function(n){const wk=weekKey();if(!S.wk||S.wk.k!==wk)S.wk={k:wk,x:0};S.wk.x+=Math.max(0,Math.round(n));_add(n);leaguePush()}})();
var _lgT=0;
(function(){let k=0;const t=setInterval(()=>{k++;if(typeof cloudOK!=='undefined'&&cloudOK&&MY_ID){clearInterval(t);leaguePush(true)}else if(k>90)clearInterval(t)},1000)})();
async function leaguePush(force){if(!DB||!MY_ID)return;if(!force&&Date.now()-_lgT<60000)return;_lgT=Date.now();
  try{const wk=weekKey();const x=S.wk&&S.wk.k===wk?S.wk.x:0;let nm=(MY_NAME||'').trim().split(/\s+/)[0]||'';if(!nm){try{const me=await USER.me();nm=((me&&me.name)||'').trim().split(/\s+/)[0]}catch(e){}}
    await DB.doc('league/'+MY_ID).set({n:(nm||'طالب').slice(0,18),w:wk,x,t:Date.now()})}catch(e){}}
async function vLeague(){
  app.innerHTML=`<div class="stack"><div><h1 style="font-size:24px;margin:0">🏆 الدوري الأسبوعي</h1><p class="muted" style="margin:4px 0 0">كل XP بتجمعها هالأسبوع بتطلّعك بالترتيب. الدوري بيبلّش من جديد كل يوم اتنين. بيبيّن الاسم الأول بس.</p></div><div id="lg" class="card"><p class="muted" style="margin:0">جاري التحميل…</p></div></div>`;
  await leaguePush(true);
  let rows=[];try{const res=await DB.collection('league').get();const arr=Array.isArray(res)?res:(res&&(res.docs||res.items||res.results))||[];
    rows=arr.map(x=>{const id=x.id||(x.ref&&x.ref.id);let d=x;if(typeof x.data==='function')d=x.data();else if(x.data&&typeof x.data==='object')d=x.data;return {id,...(d||{})}}).filter(r=>r.w===weekKey()).sort((a,b)=>b.x-a.x)}
  catch(e){$('#lg').innerHTML='<p style="margin:0">ما قدرت أجيب الترتيب. '+(IS_OWNER?'تأكد إنك ضفت قاعدة <b>league</b> بقواعد Firestore.':'جرّب بعدين.')+'</p>';return}
  const me=rows.findIndex(r=>r.id===MY_ID);const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  $('#lg').outerHTML=`<div class="card lg-list">${rows.length?rows.slice(0,50).map((r,i)=>`<div class="lg-row${r.id===MY_ID?' me':''}"><span class="lg-n">${medal(i)}</span><span class="lg-nm">${esc(r.n||'طالب')}${r.id===MY_ID?' (إنت)':''}</span><b class="lg-x">${r.x} XP</b></div>`).join(''):'<p class="muted" style="margin:0">لسا ما حدا جمع نقاط هالأسبوع. كن الأول!</p>'}
   ${me>=50?`<div class="lg-row me"><span class="lg-n">${me+1}</span><span class="lg-nm">إنت</span><b class="lg-x">${rows[me].x} XP</b></div>`:''}</div>`;
}

/* ---------- 5) الوضع الليلي ---------- */
function applyTheme(){const t=S.theme||'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
setTimeout(applyTheme,0);setInterval(applyTheme,5000);

/* ---------- الإعدادات: التقدّم بيختفي عن المستخدمين + الوضع الليلي + الهدف ---------- */
if(typeof vSettings==='function'){const _vS2=vSettings;vSettings=function(){_vS2.apply(this,arguments);const STAFF=IS_OWNER||IS_ADMIN;
  if(!STAFF){$$('section.settings h2',app).forEach(h=>{if(h.textContent.trim()==='التقدّم')h.closest('section').remove()})}
  const first=$('section.settings',app);if(first)first.insertAdjacentHTML('afterend',`<section class="card settings"><h2>🌙 المظهر</h2><div class="pager" id="thm">${[['auto','تلقائي'],['light','☀️ فاتح'],['dark','🌙 ليلي']].map(([k,l])=>`<button class="pill${(S.theme||'auto')===k?' on':''}" data-t="${k}">${l}</button>`).join('')}</div></section>
    <section class="card settings"><h2>🎯 الهدف اليومي والتذكير</h2><p class="muted" style="margin:0">هدفك هلأ: <b>${goalMin()} دقايق</b> باليوم.</p><div class="row"><a class="btn" href="#goal">غيّر الهدف أو أضف تذكير</a></div></section>`);
  $$('#thm [data-t]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;save();applyTheme();$$('#thm [data-t]').forEach(x=>x.classList.toggle('on',x===b))});
}}
</script>
