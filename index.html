<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A6B4B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Português">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<title>Português com Said</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one centered column; the path of levels is the spine, chapters open as 5-step lessons; tab bar sits at the bottom on phones */
  --paper:#F2F5EF; --card:#FFFFFF; --ink:#13261C; --muted:#5A6B60; --line:#D8E1D4;
  --green:#0A6B4B; --on-green:#FFFFFF; --green-soft:#E0EFE6;
  --sun:#E8AE00; --sun-soft:#FBF1CF; --blue:#24408E; --blue-soft:#E3E8F6;
  --ok:#0F8A54; --ok-soft:#DCF2E5; --bad:#BF3434; --bad-soft:#FAE3E1;
  --f-pt:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1410; --card:#141F19; --ink:#E5EDE7; --muted:#97AA9E; --line:#26362D;
  --green:#3CBD87; --on-green:#07130D; --green-soft:#16302A;
  --sun:#F3C43B; --sun-soft:#3A3013; --blue:#9DB1F2; --blue-soft:#1B2440;
  --ok:#45C489; --ok-soft:#14352A; --bad:#F07C74; --bad-soft:#3A1E1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1410; --card:#141F19; --ink:#E5EDE7; --muted:#97AA9E; --line:#26362D;
  --green:#3CBD87; --on-green:#07130D; --green-soft:#16302A;
  --sun:#F3C43B; --sun-soft:#3A3013; --blue:#9DB1F2; --blue-soft:#1B2440;
  --ok:#45C489; --ok-soft:#14352A; --bad:#F07C74; --bad-soft:#3A1E1D; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:84px}
.pt{font-family:var(--f-pt);unicode-bidi:isolate}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header + nav */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.brand .pt{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--green)}
.brand small{color:var(--muted);font-size:13px}
.flag{display:inline-block;width:10px;height:10px;background:var(--sun);transform:rotate(45deg);border-radius:2px;margin-inline-start:2px}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-weight:700}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--green)}
@media (min-width:820px){
  body{padding-bottom:24px}
  nav.tabs{position:sticky;top:58px;bottom:auto;display:flex;justify-content:center;gap:4px;background:var(--paper);border-top:0;border-bottom:1px solid var(--line);padding:6px}
  nav.tabs a{flex-direction:row;gap:6px;padding:7px 14px;border-radius:99px;font-size:14px}
  nav.tabs a svg{width:18px;height:18px}
  nav.tabs a.on{background:var(--green-soft)}
}
main{padding:20px 0 32px}
.stack{display:flex;flex-direction:column;gap:16px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.eyebrow{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 18px;font-weight:600;text-decoration:none;min-height:46px}
.btn.primary{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn.sun{background:var(--sun);color:#1D1700;border-color:var(--sun)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--green-soft);color:var(--green)}
.spk:active{transform:scale(.94)}
.pager{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* home */
.hello h1{font-size:26px}
.hello p{margin:6px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-pt);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:440px){.stats{grid-template-columns:repeat(2,1fr)}}
.continue{display:grid;gap:4px;text-decoration:none;background:var(--green);color:var(--on-green);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.continue .eyebrow{color:inherit;opacity:.85}
.continue .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.continue .cta{margin-top:10px;display:inline-flex;align-self:start;background:var(--sun);color:#1D1700;font-weight:700;padding:8px 16px;border-radius:99px}
.continue .bar{height:6px;background:color-mix(in srgb,var(--on-green) 25%,transparent);border-radius:9px;margin-top:8px;overflow:hidden}
.continue .bar i{display:block;height:100%;background:var(--sun)}
.level{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.level-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.level-h h2{font-size:19px}
.level-h .tag{font-family:var(--f-pt);font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:2px 8px;font-size:13px}
.nodes{display:flex;flex-direction:column;gap:8px}
.node{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);text-decoration:none;background:var(--paper)}
.node .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-pt);font-weight:800;background:var(--card);border:2px solid var(--line)}
.node .t{display:flex;flex-direction:column;line-height:1.35}
.node .t .pt{font-weight:700}
.node .t small{color:var(--muted)}
.node .st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.node.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.node.done .st{background:var(--ok-soft);color:var(--ok)}
.node.open{border-color:var(--green);background:var(--green-soft)}
.node.open .num{border-color:var(--green);color:var(--green)}
.node.open .st{background:var(--green);color:var(--on-green)}
.node.locked{opacity:.55}
.node.locked .st{background:var(--line);color:var(--muted)}
.node.exam .num{border-radius:10px;background:var(--sun-soft);border-color:var(--sun)}
.node.exam.done .num{background:var(--sun);border-color:var(--sun);color:#1D1700}
.settings{display:grid;gap:10px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch:checked{background:var(--green)}
.switch:checked::after{right:21px}

/* chapter */
.ch-head{display:grid;gap:4px}
.ch-head .pt{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--green)}
.back{font-size:14px;color:var(--muted);text-decoration:none;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-pt);font-weight:800;background:var(--paper);border:1px solid var(--line);font-size:12px}
.step.on{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.step.ok i{background:var(--ok);color:#fff;border-color:var(--ok)}
.lesson h3{font-size:18px;margin:18px 0 8px;color:var(--blue)}
.lesson h3:first-child{margin-top:0}
.lesson p{margin:0 0 10px;max-width:65ch}
.tbl{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:15px}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:700}
.tbl td.pt{font-weight:700;direction:ltr;text-align:left}
.tip{background:var(--sun-soft);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
.tip b{color:var(--ink)}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ex .pt{font-weight:700;direction:ltr}
.ex .ar{color:var(--muted);font-size:14px;margin-inline-start:auto;text-align:left}
.ex-list{display:flex;flex-direction:column}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.wcard .pt{font-size:20px;font-weight:700;direction:ltr;text-align:right}
.wcard .pron{color:var(--muted);font-size:13px}
.wcard .mean{grid-column:1/-1;font-weight:600;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.wcard .spk{grid-row:1/3;grid-column:2}
.hide-mean .mean{filter:blur(6px);cursor:pointer;user-select:none}
.hide-mean .mean.peek{filter:none}
.slist{display:flex;flex-direction:column;gap:8px}
.sitem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.sitem .pt{font-size:18px;font-weight:700;direction:ltr;text-align:right}
.sitem .ar{grid-column:2;color:var(--muted)}
.sitem .slow{grid-row:1/3;grid-column:3;font-size:12px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 10px}
.sitem .spk{grid-row:1/3}
.ch-label{font-size:13px;font-weight:700;color:var(--blue);margin:10px 0 2px}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums;font-family:var(--f-pt)}
.qbar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--green);transition:width .3s}
.sec-tag{align-self:start;font-size:13px;font-weight:700;background:var(--blue-soft);color:var(--blue);border-radius:99px;padding:3px 12px}
.passage{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.passage p{margin:0;font-family:var(--f-pt);font-size:17px;line-height:1.65;text-align:left}
.qlab{margin:0;font-size:17px;font-weight:700}
.qword{display:flex;align-items:center;gap:12px;justify-content:center;padding:14px;background:var(--paper);border-radius:14px}
.qword .pt{font-size:28px;font-weight:800;direction:ltr}
.qword.ar-big{font-size:24px;font-weight:700}
.listen-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px}
.listen-big{width:96px;height:96px;border-radius:50%;border:0;background:var(--green);color:var(--on-green);display:grid;place-items:center}
.listen-big svg{width:40px;height:40px}
.linkbtn{background:none;border:0;color:var(--green);font-weight:700;text-decoration:underline;padding:4px}
.opts{display:grid;gap:8px}
.opt{text-align:start;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:600;min-height:52px}
.opt.pt{direction:ltr;text-align:left}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.tin{width:100%;font-family:var(--f-pt);font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);direction:ltr;text-align:left}
.tin:focus{border-color:var(--green);outline:none}
.accents{display:flex;gap:6px;flex-wrap:wrap;direction:ltr}
.accents button{font-family:var(--f-pt);border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:38px;font-size:17px}
.fb{border-radius:12px;padding:0;font-weight:600}
.fb.show{padding:12px 14px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.mid{background:var(--sun-soft);color:var(--ink)}
.fb .ans{display:block;color:var(--ink);font-family:var(--f-pt);font-size:17px;direction:ltr;text-align:left;margin-top:4px}
.ansline{min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr;align-content:flex-start}
.tiles{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center}
.tile{font-family:var(--f-pt);font-size:18px;font-weight:700;border:1px solid var(--line);border-bottom-width:3px;background:var(--card);border-radius:10px;padding:8px 12px}
.tile.used{visibility:hidden}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring b{width:112px;height:112px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--f-pt);font-size:34px;font-weight:800}
.review{text-align:start;width:100%;display:flex;flex-direction:column;gap:6px}
.review div{background:var(--paper);border-radius:10px;padding:8px 12px;font-size:15px}
.review .pt{direction:ltr;display:inline-block;font-weight:700}
.secbars{width:100%;display:grid;gap:10px;text-align:start}
.secbar{display:grid;grid-template-columns:80px 1fr 48px;gap:10px;align-items:center;font-weight:600}
.secbar .tr{height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.secbar .tr i{display:block;height:100%;border-radius:9px}
.secbar span:last-child{font-family:var(--f-pt);font-variant-numeric:tabular-nums;text-align:left}

/* games */
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gcard{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:4px;min-height:120px}
.gcard .gi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-pt);font-weight:800;font-size:18px;margin-bottom:4px}
.gcard h3{font-size:17px}
.gcard p{margin:0;font-size:13px;color:var(--muted)}
.gcard small{margin-top:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ghead{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;margin-bottom:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 8px;font-weight:700;font-size:16px;min-height:54px}
.mt.pt{direction:ltr}
.mt.sel{border-color:var(--blue);background:var(--blue-soft)}
.mt.gone{opacity:.2;border-color:var(--ok)}
.shake{animation:shake .35s;border-color:var(--bad)!important}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tf{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.tf .pair{width:100%;background:var(--paper);border-radius:16px;padding:22px 12px;display:grid;gap:6px}
.tf .pair .pt{font-size:30px;font-weight:800}
.tf .pair .ar{font-size:22px;font-weight:600}
.tf .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tf .btns button{min-height:60px;font-size:18px;font-weight:700;border-radius:14px;border:0}
.tf .yes{background:var(--ok);color:#fff}
.tf .no{background:var(--bad);color:#fff}
.timer{font-family:var(--f-pt);font-variant-numeric:tabular-nums;font-size:20px;font-weight:800}
.flash{perspective:900px;width:100%}
.flash .face{min-height:220px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;cursor:pointer}
.flash .face .pt{font-size:36px;font-weight:800;direction:ltr}
.flash .face.back{background:var(--green-soft)}
.flash .face .ar{font-size:26px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v2 additions */
nav.tabs{grid-template-columns:repeat(6,1fr)}
nav.tabs a{font-size:11px}
@media (min-width:820px){nav.tabs a{font-size:14px}}
.lesson em,.card em{font-style:normal;font-family:var(--f-pt);font-weight:700;color:var(--green);unicode-bidi:isolate;direction:ltr;cursor:pointer;border-bottom:1px dotted var(--green)}
.lesson b[dir="ltr"]{font-family:var(--f-pt);unicode-bidi:isolate}
.ex{align-items:flex-start}
.ex .spk{margin-top:2px}
.ex-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.ex-t .pt{font-weight:700;font-size:17px;direction:ltr;text-align:right}
.pron{color:var(--blue);font-size:14px;font-weight:500}
.ex-t .ar{color:var(--muted);font-size:15px;margin:0;text-align:right}
.tbl-wrap{overflow-x:auto;margin:6px 0 12px}
.tbl{margin:0}
.tbl td.pt{white-space:nowrap}
.mini{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:0;background:var(--green-soft);color:var(--green);vertical-align:middle;margin-inline-end:6px;padding:0}
.mini svg{width:14px;height:14px}

<script>/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SPK='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const isPt=s=>/[A-Za-zÀ-ÿ]/.test(s)&&!/[؀-ۿ]/.test(s);
const LAT=/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9'’\-.,!?$ ]*[A-Za-zÀ-ÿ0-9!?.]|[A-Za-zÀ-ÿ]/g;
function bidi(s){s=String(s==null?'':s);let out='',last=0;s.replace(LAT,(m,off)=>{out+=esc(s.slice(last,off))+`<span class="pt" dir="ltr">${esc(m)}</span>`;last=off+m.length;return m});return out+esc(s.slice(last))}
const P=s=>`<span class="pt" lang="pt-BR" dir="ltr">${esc(s)}</span>`;
const sayBtn=t=>`<button class="spk" data-say="${esc(t)}" aria-label="استمع">${SPK}</button>`;
const lines=s=>String(s).trim().split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split('|').map(x=>x.trim()));

/* ---------- lesson builders ---------- */
const H=t=>`<h3>${t}</h3>`;
const Pp=t=>`<p>${t}</p>`;
const TIP=t=>`<div class="tip">${t}</div>`;
const exRow=(pt,pr,ar)=>`<div class="ex">${sayBtn(pt)}<div class="ex-t"><span class="pt" lang="pt-BR" dir="ltr">${esc(pt)}</span>${SYL(pt)}${pr?`<span class="pron">${esc(pr)}</span>`:''}${ar?`<span class="ar">${bidi(ar)}</span>`:''}</div>${PIC(pt,2)}</div>`;
const X=s=>`<div class="ex-list">${lines(s).map(([a,b,c])=>exRow(a,b,c)).join('')}</div>`;
const TB=(s,head,speak=true)=>`<div class="tbl-wrap"><table class="tbl">${head?`<tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>`:''}${lines(s).map(r=>`<tr><td class="pt" lang="pt-BR" dir="ltr">${speak?`<button class="mini" data-say="${esc(r[0])}" aria-label="استمع">${SPK}</button>`:''}${esc(r[0])}${speak?SYL(r[0]):''}</td>${r.slice(1).map(c=>`<td>${bidi(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;

/* ---------- question builders ---------- */
const K=(q,it)=>{q.key=it.key;return q};
const Q={
  fill:(sent,hint,c,...w)=>{const o=shuffle([c,...w]);return{t:'fill',sent,hint,o,a:o.indexOf(c),full:sent.replace('___',c).replace(/\s*\([^)]*\)/g,'')}},

  tf:(lab,stmt,truth,x)=>Object.assign({t:'tf',lab,stmt,truth},x||{}),

  scr:(ar,ans)=>({t:'scr',lab:'رتّب الكلمات وكوّن الجملة',ar,ans})
};
function drillQ(d){const q=drillQ0(d);q.key='d|'+d[0];return q}
function drillQ0(d){const[p,h,c,...w]=d;if(p.includes('___'))return Q.fill(p,h,c,...w);const lat=(p.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\- ]*[A-Za-zÀ-ÿ]|[A-Za-zÀ-ÿ]/g)||[]).join(' ');return Q.mc(p,c,w,{hint:h,sayLat:lat})}

/* ---------- data registry ---------- */
const CH=[];
function C(o){o.W=lines(o.w).map(([pt,pron,ar])=>({pt,pron,ar,ch:o.id,key:'w|'+pt}));o.S=lines(o.s).map(([pt,pron,ar])=>({pt,pron,ar,ch:o.id,key:'s|'+pt}));o.D=lines(o.d);CH[o.id-1]=o}
const EXAMS={};
const NC=[];

/* ===== syllables (تقطيع المقاطع) + stress ===== */
const VOW='aeiouáéíóúâêôãõàü';
const isVow=c=>!!c&&VOW.includes(c);
const CLUSTER=/^[bcdfgkptv][lr]$/;
const _sylCache=new Map();
function sylWord(w){
  if(_sylCache.has(w))return _sylCache.get(w);
  const lw=w.toLowerCase();const units=[];let i=0;
  while(i<lw.length){const c=lw[i],n=lw[i+1]||'';
    if((c==='q'||c==='g')&&n==='u'&&isVow(lw[i+2])){units.push({v:false,s:w.substr(i,2),k:c+n});i+=2;continue}
    if((c==='c'||c==='l'||c==='n')&&n==='h'){units.push({v:false,s:w.substr(i,2),k:c+n});i+=2;continue}
    units.push({v:isVow(c),s:w[i],k:c});i++}
  // nuclei
  const parts=[];// sequence of {type:'N'|'C', items:[]}
  for(let j=0;j<units.length;j++){const u=units[j];
    if(!u.v){parts.push({t:'C',s:u.s,k:u.k});continue}
    const last=parts[parts.length-1];
    if(last&&last.t==='N'){const prev=last.k[last.k.length-1],c=u.k;
      let join=false;
      if((c==='i'||c==='u')&&prev!==c){join=true;const nx=units[j+1],nx2=units[j+2];
        if(nx&&!nx.v&&(nx.k==='nh'||(/^[rlzmn]$/.test(nx.k)&&(!nx2||!nx2.v))))join=false;
        if(last.k.length>=2)join=false}
      if(/[ãõ]/.test(prev)&&(c==='o'||c==='e'||c==='i'))join=true;
      if(join){last.s+=u.s;last.k+=c;continue}}
    parts.push({t:'N',s:u.s,k:u.k})}
  const nIdx=parts.map((p,k)=>p.t==='N'?k:-1).filter(k=>k>=0);
  if(nIdx.length<=1){const r=[w];_sylCache.set(w,r);return r}
  const syl=[];let start=0;
  for(let a=0;a<nIdx.length-1;a++){const n1=nIdx[a],n2=nIdx[a+1];const cons=parts.slice(n1+1,n2);let cut;
    if(cons.length===0)cut=n1+1;
    else if(cons.length===1)cut=n1+1;
    else{const l2=cons.slice(-2).map(x=>x.k).join('');cut=CLUSTER.test(l2)?n2-2:n2-1}
    syl.push(parts.slice(start,cut).map(p=>p.s).join(''));start=cut}
  syl.push(parts.slice(start).map(p=>p.s).join(''));
  _sylCache.set(w,syl);return syl;
}
function stressIdx(sy){const n=sy.length;if(n===1)return 0;
  for(let i=n-1;i>=0;i--)if(/[áéíóúâêô]/i.test(sy[i]))return i;
  for(let i=n-1;i>=0;i--)if(/[ãõ]/i.test(sy[i]))return i;
  const w=sy.join('').toLowerCase();
  return /(a|e|o|as|es|os|am|em|ens)$/.test(w)?n-2:n-1}
function sylHTML(text){
  return String(text).split(/([A-Za-zÀ-ÿ]+)/).map(tok=>{
    if(!/^[A-Za-zÀ-ÿ]+$/.test(tok))return esc(tok);
    const sy=sylWord(tok);if(sy.length<2)return esc(tok);
    const st=stressIdx(sy);return sy.map((s,k)=>k===st?`<b>${esc(s)}</b>`:esc(s)).join('·')}).join('');
}

function emojis(text,max){
  const n=nrm(text);const out=[];
  for(const p in PHRASE){if((' '+n+' ').includes(' '+p+' ')&&!out.includes(PHRASE[p]))out.push(PHRASE[p])}
  for(const t of n.split(' ')){if(out.length>=max)break;if(!t)continue;
    let e=EX[t];
    if(e===undefined&&t.length>=4){const s=STEMS.find(([k])=>t.startsWith(k));if(s)e=s[1]}
    if(e&&!out.includes(e))out.push(e)}
  return out.slice(0,max);
}
const PIC=(text,max,fallback)=>{const e=emojis(text,max);if(e.length)return `<span class="pic" aria-hidden="true">${e.join('')}</span>`;return fallback?`<span class="pic dim" aria-hidden="true">${fallback}</span>`:''};

C({id:50,u:12,pt:'Futuro do subjuntivo',ar:'المستقبل الشرطي: لما / إذا',

H('التكوين')+Pp('خذ فعل <b>eles</b> في الماضي التام (perfeito)، احذف <b>-ram</b>، وأضف: <b>-, -, -mos, -rem</b>.')+TB(`falaram → falar|quando eu falar

X(`Quando eu chegar, te ligo.|كواندو إيو شيغار، تشي ليغو.|عندما أصل أتصل بك.

EXAMS[11]={chs:[43,44,45,46],passage:'Na minha opinião, a cidade onde moro é ótima para famílias. Por um lado, o transporte é organizado e há muitos parques. Por outro lado, o inverno é longo e o aluguel está caro. Quando cheguei, tudo me parecia estranho, mas aos poucos me acostumei. Além disso, a cidade foi planejada nos anos setenta, por isso é bem organizada.',

EXAMS[12]={chs:[47,48,49,50],passage:'Querida Laila, espero que você esteja bem. Fico muito feliz que você venha nos visitar em dezembro! Quando você chegar ao aeroporto, me ligue. Se fizer frio, traga um casaco, porque aqui o tempo muda muito. Talvez a gente vá à praia no fim de semana, mas duvido que esteja calor. Tomara que dê tudo certo com a sua viagem!',

EXAMS[14]={chs:[55,56,57],passage:'No sábado teve churrasco na casa do Marcos. Ele me convidou: "Bora? Vai ser massa!" Eu topei e levei uma sobremesa. Cheguei um pouco atrasado, mas tava de boa, porque no Brasil isso é normal. Lá, o pessoal falava pelos cotovelos sobre futebol. Eu paguei mico quando confundi o nome do time do Marcos, mas todo mundo riu.',

EXAMS[20]={chs:[77,78,79,80],passage:'Prezados, informamos que a reunião foi transferida para as quinze horas, haja vista a indisponibilidade da sala. Não obstante, o prazo de entrega do relatório permanece o mesmo. À medida que os setores enviarem os dados, a equipe fará a análise. Por que a mudança? Porque houve um problema técnico. Diga-nos, por gentileza, se haverá algum impedimento.',

EXAMS[22]={chs:[85,86,87,88],passage:'Meu primeiro ano no Brasil foi difícil. Consegui o visto a duras penas e, quando cheguei, não entendia as entrelinhas: quando alguém dizia "passa lá em casa", eu ia mesmo! Aos poucos, aprendi a ter jogo de cintura. Como diz o ditado, de grão em grão, a galinha enche o papo. Hoje leio Clarice Lispector e ouço bossa nova. Antes tarde do que nunca!',

Object.entries(EXTRA).forEach(([id,e])=>{const c=CH[id-1];if(!c)return;const byLen=a=>a.sort((x,y)=>x[0].length-y[0].length);e={w:byLen(lines(e.w)).map(x=>x.join('|')).join('\n'),s:byLen(lines(e.s)).map(x=>x.join('|')).join('\n')};const hw=new Set(c.W.map(x=>x.pt)),hs=new Set(c.S.map(x=>x.pt));lines(e.w).forEach(([pt,pron,ar])=>{if(pt&&!hw.has(pt))c.W.push({pt,pron,ar,ch:c.id,key:'w|'+pt,x:1})});lines(e.s).forEach(([pt,pron,ar])=>{if(pt&&!hs.has(pt))c.S.push({pt,pron,ar,ch:c.id,key:'s|'+pt,x:1})})});

B|Não, mas tinha um jardim com uma oliveira.|ناو، ماس تشينيا أون جاردجين كوم أوما أوليڤيرا.|لا، بس كان فيه جنينة فيها شجرة زيتون.`,

27:{sp:['Atendente','Samira'],l:`A|Bom dia! Qual serviço a senhora precisa?|بوم دجيا! كواو سيرڤيسو آ سينيورا بريسيزا؟|صباح الخير! شو الخدمة اللي بدك إياها؟
B|Preciso tirar o CPF.|بريسيزو تشيرار أو سيه بيه إيفي.|بدي أطلّع رقم الـCPF.
A|A senhora trouxe o passaporte?|آ سينيورا تروسي أو باساپورتشي؟|جبتِ الجواز؟
B|Trouxe, e também o comprovante de endereço.|تروسي، إي تامبين أو كومبروڤانتشي دجي إينديريسو.|جبته، وكمان إثبات السكن.
A|Ótimo. Preencha este formulário e assine aqui.|أوتشيمو. بريينشا إيستشي فورمولاريو إي أسيني أكي.|ممتاز. عبّي هالاستمارة ووقّعي هون.
B|Quanto tempo demora?|كوانتو تيمبو ديمورا؟|قديش بياخد وقت؟
A|O número sai hoje mesmo.|أو نوميرو ساي أوجي ميزمو.|الرقم بيطلع اليوم نفسه.`,
q:[['شو بدها سميرة؟','تطلّع CPF','تفتح حساب بنك','تجدد الجواز'],['شو جابت معها؟','الجواز وإثبات السكن','صور بس','ولا اشي'],['متى بيطلع الرقم؟','اليوم نفسه','بعد أسبوع','بعد شهر']]},
28:{sp:['Gerente','Ali'],l:`A|Boa tarde! Em que posso ajudar?|بوا تاردجي! إين كي بوسو أجودار؟|مساء الخير! كيف بقدر أساعدك؟
B|Quero abrir uma conta corrente.|كيرو أبرير أوما كونتا كوهينتشي.|بدي أفتح حساب جاري.
A|O senhor tem CPF e comprovante de renda?|أو سينيور تين سيه بيه إيفي إي كومبروڤانتشي دجي هيندا؟|عندك CPF وإثبات دخل؟
B|Tenho CPF. Sou autônomo, não tenho holerite.|تينيو سيه بيه إيفي. سو آوتونومو، ناو تينيو أوليريتشي.|عندي CPF. أنا شغل حر، ما عندي قسيمة راتب.
A|Sem problema. Pode ser o extrato do último mês.|سين بروبليما. بودجي سير أو إيستراتو دو أولتشيمو ميس.|ما في مشكلة. بيزبط كشف حساب آخر شهر.
B|Perfeito. E o cartão chega quando?|بيرفيتو. إي أو كارتاو شيغا كواندو؟|ممتاز. والبطاقة متى بتوصل؟
A|Em até dez dias úteis.|إين أتيه ديز دجياس أوتيس.|خلال عشر أيام عمل.`,
q:[['شو نوع الحساب؟','حساب جاري','حساب توفير','قرض'],['ليش ما عنده قسيمة راتب؟','لأنه شغل حر','لأنه ضيعها','لأنه طالب'],['متى بتوصل البطاقة؟','خلال 10 أيام عمل','بكرة','بعد شهرين']]},
29:{sp:['Secretária','Yusuf'],l:`A|Alô, clínica Bem-Estar, quem fala?|ألو، كلينيكا بين إيستار، كين فالا؟|ألو، عيادة «بين إيستار»، مين معي؟
B|Aqui é o Yusuf. Eu liguei ontem, mas a ligação caiu.|أكي إيه أو يوسف. إيو ليغيي أونتين، ماس آ ليغاساو كاييو.|معك يوسف. اتصلت مبارح بس الخط قطع.
A|Desculpe! O senhor pode repetir o assunto?|ديسكولبي! أو سينيور بودجي هيبيتشير أو أسونتو؟|آسفة! بتقدر تعيد الموضوع؟
B|Quero saber o resultado do exame.|كيرو سابير أو هيزولتادو دو إيزامي.|بدي أعرف نتيجة الفحص.
A|Vou mandar pelo WhatsApp, tá bom?|ڤو ماندار بيلو واتساب، تا بون؟|رح أبعتها عالواتساب، ماشي؟
B|Tá ótimo. Pode mandar um áudio também?|تا أوتشيمو. بودجي ماندار أون آوديو تامبين؟|تمام كتير. بتقدري تبعتي فويس كمان؟`,
q:[['ليش اتصل يوسف مرة تانية؟','لأن الخط قطع مبارح','لأنه نسي','لأنه غيّر رقمه'],['شو بده يعرف؟','نتيجة الفحص','موعد جديد','السعر'],['كيف رح توصله النتيجة؟','عالواتساب','بالبريد','بالعيادة']]},
30:{sp:['Recepção','Layla'],l:`A|Clínica Sorriso, bom dia!|كلينيكا سوهيزو، بوم دجيا!|عيادة «سوهيزو»، صباح الخير!
B|Bom dia! Eu gostaria de remarcar minha consulta.|بوم دجيا! إيو غوستاريا دجي هيماركار مينيا كونسولتا.|صباح الخير! بدي أغيّر موعدي.
A|Para quando estava marcada?|بارا كواندو إيستاڤا ماركادا؟|لإيمتى كان؟
B|Para amanhã, às dez. Mas tenho um imprevisto.|بارا أمانيا، آس ديز. ماس تينيو أون إيمبريڤيستو.|لبكرة الساعة عشرة. بس صار عندي ظرف.
A|Tem horário disponível na quinta, às três.|تين أوراريو دجيسبونيڤيو نا كينتا، آس تريس.|في وقت فاضي يوم الخميس الساعة تلاتة.
B|Pode ser. Muito obrigada pela compreensão.|بودجي سير. مويتو أوبريغادا بيلا كومبريينساو.|ماشي. شكرًا كتير على تفهمك.`,
q:[['شو بدها ليلى؟','تغيّر موعدها','تلغي العلاج','تدفع'],['متى كان الموعد الأصلي؟','بكرة الساعة 10','الخميس الساعة 3','اليوم'],['أي موعد جديد أخدت؟','الخميس الساعة 3','الجمعة الصبح','بكرة العصر']]},
31:{sp:['Secretaria','Mãe'],l:`A|Boa tarde! Posso ajudar?|بوا تاردجي! بوسو أجودار؟|مساء الخير! بقدر أساعدك؟
B|Quero fazer a matrícula do meu filho. Ele tem sete anos.|كيرو فازير آ ماتريكولا دو ميو فيليو. إيلي تين سيتشي آنوس.|بدي أسجّل ابني. عمره سبع سنين.
A|Ele vai para o segundo ano. Trouxe a certidão e a carteira de vacinação?|إيلي ڤاي بارا أو سيغوندو آنو. تروسي آ سيرتشيداو إي آ كارتيرا دجي ڤاسيناساو؟|رح يكون بالصف التاني. جبتِ شهادة الميلاد ودفتر التطعيم؟
B|Trouxe. Ele ainda não fala muito português.|تروسي. إيلي آيندا ناو فالا مويتو بورتوغيس.|جبتهم. لسا ما بيحكي برتغالي كتير.
A|Não se preocupe. Temos reforço à tarde.|ناو سي بريوكوبي. تيموس هيفورسو آ تاردجي.|لا تقلقي. عنا دروس تقوية العصر.
B|Que bom! E se ele precisar faltar?|كي بون! إي سي إيلي بريسيزار فاوتار؟|حلو! وإذا اضطر يغيب؟
A|É só mandar um bilhete na agenda.|إيه سو ماندار أون بيلييتشي نا أجيندا.|بس ابعتي ورقة بدفتر التواصل.`,
q:[['بأي صف رح يكون الولد؟','التاني','الأول','التالت'],['شو في للأولاد اللي ما بيحكوا برتغالي منيح؟','دروس تقوية العصر','ولا اشي','مدرسة تانية'],['شو بتعمل إذا غاب؟','بتبعت ورقة بدفتر التواصل','بتتصل بالشرطة','ما بتعمل اشي']]},
32:{sp:['Instrutor','Hassan'],l:`A|Entre, por favor. Sente aqui.|إينتري، بور فاڤور. سينتشي أكي.|تفضل ادخل. اقعد هون.
B|Obrigado. É a minha primeira aula de direção.|أوبريغادو. إيه آ مينيا بريميرا آولا دجي دجيريساو.|شكرًا. هاد أول درس سواقة إلي.
A|Coloque o cinto e ajuste o espelho.|كولوكي أو سينتو إي أجوستشي أو إيسبيليو.|حط الحزام وظبّط المراية.
B|Pronto. E agora?|برونتو. إي أغورا؟|جاهز. وهلأ؟
A|Ligue o carro e saia devagar. Não acelere muito!|ليغي أو كاهو إي سايا ديڤاغار. ناو أسيليري مويتو!|شغّل السيارة واطلع على مهل. لا تسرّع كتير!
B|Pode falar mais devagar, por favor?|بودجي فالار مايس ديڤاغار، بور فاڤور؟|بتقدر تحكي أبطأ لو سمحت؟`,
q:[['شو نوع الدرس؟','درس سواقة','درس برتغالي','درس سباحة'],['شو أول اشي طلبه المدرب؟','يحط الحزام ويظبط المراية','يسرّع','يطفي السيارة'],['أي جملة طلب فيها حسن مساعدة؟','Pode falar mais devagar?','Ligue o carro','Sente aqui']]},
33:{sp:['Lucas','Tarek'],l:`A|Você prefere morar numa cidade grande ou pequena?|ڤوسي بريفيري مورار نوما سيدادجي غرانجي أو بيكينا؟|بتفضّل تسكن بمدينة كبيرة ولا صغيرة؟
B|Pequena. É mais tranquila que uma cidade grande.|بيكينا. إيه مايس ترانكويلا كي أوما سيدادجي غرانجي.|صغيرة. أهدى من المدينة الكبيرة.
A|Mas tem menos opções, né?|ماس تين مينوس أوبسويس، نيه؟|بس فيها خيارات أقل، صح؟
B|É, tem menos empregos. Mas o trânsito é melhor.|إيه، تين مينوس إيمبريغوس. ماس أو ترانزيتو إيه ميليور.|آه، فيها شغل أقل. بس السير أحسن.
A|E o aluguel?|إي أو آلوغيو؟|والإيجار؟
B|É mais barato. Nas capitais, o aluguel é o mais caro.|إيه مايس باراتو. ناس كابيتاييس، أو آلوغيو إيه أو مايس كارو.|أرخص. بالعواصم الإيجار هو الأغلى.`,
q:[['ليش طارق بيفضّل المدينة الصغيرة؟','لأنها أهدى','لأنها أسخن','لأنها أكبر'],['شو العيب بالمدينة الصغيرة؟','شغل أقل','سير أكتر','إيجار أغلى'],['شو معنى melhor؟','أحسن','أسوأ','أكبر']]},
34:{sp:['Ana','Rami'],l:`A|Como é a sua rotina?|كومو إيه آ سوا هوتشينا؟|كيف روتينك؟
B|Eu me levanto às seis e me arrumo rápido.|إيو مي ليڤانتو آس سييس إي مي أهومو هابيدو.|بقوم الساعة ستة وبجهّز حالي بسرعة.
A|E seus filhos?|إي سيوس فيليوس؟|وولادك؟
B|Eles se vestem sozinhos, mas demoram para acordar.|إيليس سي ڤيستين سوزينيوس، ماس ديمورام بارا أكوردار.|بيلبسوا لحالهم، بس بيتأخروا ليصحوا.
A|E à noite, você se cansa?|إي آ نويتشي، ڤوسي سي كانسا؟|وبالليل بتتعب؟
B|Muito! Eu me deito às onze e durmo na hora.|مويتو! إيو مي ديتو آس أونزي إي دورمو نا أورا.|كتير! بنام الساعة 11 وبغفى دغري.`,
q:[['متى بيقوم رامي؟','الساعة 6','الساعة 8','الساعة 11'],['شو مشكلة الأولاد؟','بيتأخروا ليصحوا','ما بيلبسوا','ما بيروحوا عالمدرسة'],['ليش بنستعمل «me» بـ eu me levanto؟','لأنه فعل انعكاسي','لأنه ماضي','لأنه سؤال']]},
35:{sp:['Dono da loja','Bilal'],l:`A|Oi, tudo bem? Posso ajudar?|أوي، تودو بين؟ بوسو أجودار؟|هاي، كيفك؟ بقدر أساعدك؟
B|Vi a placa lá fora. Vocês estão contratando?|ڤي آ بلاكا لا فورا. ڤوسيس إيستاو كونتراتاندو؟|شفت اللوحة برا. عم توظفوا؟
A|Estamos, sim. Precisamos de um vendedor.|إيستاموس، سين. بريسيزاموس دجي أون ڤينديدور.|آه. بدنا بياع.
B|Eu tenho experiência com vendas. Posso deixar meu currículo?|إيو تينيو إيسبيريينسيا كوم ڤينداس. بوسو ديشار ميو كوهيكولو؟|عندي خبرة بالبيع. بقدر أترك السيرة الذاتية؟
A|Pode. Você tem disponibilidade aos sábados?|بودجي. ڤوسي تين دجيسبونيبيليدادجي آوس سابادوس؟|أكيد. إنت فاضي أيام السبت؟
B|Tenho, sim. Posso começar quando precisarem.|تينيو، سين. بوسو كوميسار كواندو بريسيزارين.|آه. بقدر أبلش وقت ما بدكم.`,
q:[['كيف عرف بلال إنهم بيوظفوا؟','شاف لوحة برا','من صاحبه','من الإنترنت'],['شو الوظيفة؟','بياع','طباخ','سواق'],['شو ترك بلال؟','السيرة الذاتية','رقم تلفون بس','ولا اشي']]},
36:{sp:['Entrevistadora','Said'],l:`A|Fale um pouco sobre você.|فالي أون بوكو سوبري ڤوسي.|احكيلي شوي عن حالك.
B|Trabalho com fotografia há dez anos.|تراباليو كوم فوتوغرافيا آ ديز آنوس.|بشتغل بالتصوير من عشر سنين.
A|E qual foi a sua última experiência?|إي كواو فوي آ سوا أولتشيما إيسبيريينسيا؟|وشو آخر خبرة إلك؟
B|Trabalhei como designer gráfico numa agência no Egito.|ترابالييه كومو دجيزاينير غرافيكو نوما أجينسيا نو إيجيتو.|اشتغلت مصمم جرافيك بوكالة بمصر.
A|Qual é o seu ponto forte?|كواو إيه أو سيو بونتو فورتشي؟|شو نقطة قوتك؟
B|Sou criativo e cumpro prazos.|سو كرياتشيڤو إي كومبرو برازوس.|أنا مبدع وبلتزم بالمواعيد.`,
q:[['من قديش بيشتغل بالتصوير؟','عشر سنين','سنتين','خمس سنين'],['وين كانت آخر خبرة؟','وكالة بمصر','شركة بالبرازيل','جريدة'],['شو نقطة قوته؟','مبدع وبلتزم بالمواعيد','بيحكي لغات كتير','بيسوق منيح']]},
37:{sp:['Marcos','Fatima'],l:`A|Você viu a Júlia hoje?|ڤوسي ڤيو آ جوليا أوجي؟|شفتِ جوليا اليوم؟
B|Vi, sim. Eu a encontrei no mercado.|ڤي، سين. إيو آ إينكونتريي نو ميركادو.|آه شفتها. لقيتها بالسوق.
A|Ela me pediu o seu número.|إيلا مي بيدجيو أو سيو نوميرو.|طلبت مني رقمك.
B|Pode passar para ela. Eu te dou permissão!|بودجي باسار بارا إيلا. إيو تشي دو بيرميساو!|بتقدر تعطيها إياه. بعطيك الإذن!
A|Combinado. Vou mandar para ela agora.|كومبينادو. ڤو ماندار بارا إيلا أغورا.|اتفقنا. رح أبعتلها هلأ.
B|Obrigada! Depois me conta o que ela queria.|أوبريغادا! ديبويس مي كونتا أو كي إيلا كيريا.|شكرًا! بعدين احكيلي شو بدها.`,
q:[['وين لقت فاطمة جوليا؟','بالسوق','بالمدرسة','بالشغل'],['شو طلبت جوليا؟','رقم فاطمة','عنوانها','مصاري'],['شو معنى «Eu a encontrei»؟','لقيتها','لقيته','لقيتك']]},
38:{sp:['Clara','Ahmad'],l:`A|Quais são seus planos para o ano que vem?|كوايس ساو سيوس بلانوس بارا أو آنو كي ڤين؟|شو خططك للسنة الجاية؟
B|Vou fazer um curso técnico e vou tirar a carteira de motorista.|ڤو فازير أون كورسو تيكنيكو إي ڤو تشيرار آ كارتيرا دجي موتوريستا.|رح آخد دورة مهنية ورح أطلّع رخصة سواقة.
A|E a família?|إي آ فاميليا؟|والعيلة؟
B|Meus filhos vão começar na escola nova.|ميوس فيليوس ڤاو كوميسار نا إسكولا نوڤا.|ولادي رح يبلشوا بمدرسة جديدة.
A|Vocês vão viajar?|ڤوسيس ڤاو ڤياجار؟|رح تسافروا؟
B|Acho que sim. Talvez a gente vá para Florianópolis.|أشو كي سين. تاوڤيز آ جينتشي ڤا بارا فلوريانوبوليس.|بظن آه. يمكن نروح على فلوريانوبوليس.`,
q:[['شو رح يطلّع أحمد؟','رخصة سواقة','جواز سفر','شهادة جامعية'],['شو رح يصير مع الأولاد؟','رح يبلشوا بمدرسة جديدة','رح يسافروا لحالهم','رح يشتغلوا'],['وين ممكن يسافروا؟','فلوريانوبوليس','ساو باولو','غزة']]},
39:{sp:['Médica','Mona'],l:`A|O que a senhora está sentindo?|أو كي آ سينيورا إيستا سينتشيندو؟|شو حاسة؟
B|Estou com dor nas costas e dor de cabeça.|إيستو كوم دور ناس كوستاس إي دور دجي كابيسا.|عندي وجع ضهر ووجع راس.
A|Há quanto tempo?|آ كوانتو تيمبو؟|من قديش؟
B|Comecei a sentir isso há três dias.|كوميسيي آ سينتشير إيسو آ تريس دجياس.|بلشت أحس فيه من تلات أيام.
A|A senhora tem alergia a algum remédio?|آ سينيورا تين أليرجيا آ آوغون هيميدجيو؟|عندك حساسية من أي دوا؟
B|Tenho alergia a dipirona.|تينيو أليرجيا آ دجيبيرونا.|عندي حساسية من الديبيرونا.
A|Certo. Vou passar outro remédio e um exame de sangue.|سيرتو. ڤو باسار أوترو هيميدجيو إي أون إيزامي دجي سانغي.|تمام. رح أكتبلك دوا تاني وفحص دم.`,
q:[['شو بيوجع منى؟','ضهرها وراسها','بطنها','سنانها'],['من قديش؟','تلات أيام','أسبوع','يوم'],['من شو عندها حساسية؟','ديبيرونا','بنسلين','ولا اشي']]},
40:{sp:['Encanador','Khaled'],l:`A|Qual é o problema?|كواو إيه أو بروبليما؟|شو المشكلة؟
B|Tem um vazamento embaixo da pia da cozinha.|تين أون ڤازامينتو إينبايشو دا بيا دا كوزينيا.|في تسريب مي تحت مجلى المطبخ.
A|Faz tempo?|فاز تيمبو؟|من زمان؟
B|Desde ontem. E o chuveiro queimou também.|ديزدجي أونتين. إي أو شوڤيرو كيمو تامبين.|من مبارح. والدوش احترق كمان.

69:{sp:['Ana','Omar'],l:`A|Você viu a notícia de hoje?|ڤوسي ڤيو آ نوتيسيا دجي أوجي؟|شفت خبر اليوم؟

70:{sp:['Assistente social','Mãe'],l:`A|Como posso ajudar a senhora?|كومو بوسو أجودار آ سينيورا؟|كيف بقدر أساعدك؟

72:{sp:['Moderadora','Debatedor'],l:`A|O tema de hoje: o celular deve ser proibido nas escolas?|أو تيما دجي أوجي: أو سيلولار ديڤي سير بروئيبيدو ناس إسكولاس؟|موضوع اليوم: لازم يتمنع الجوال بالمدارس؟

73:{sp:['Colega','Ziad'],l:`A|Ziad, você está esquisito hoje. Aconteceu algo?|زياد، ڤوسي إيستا إيسكيزيتو أوجي. أكونتيسيو آوغو؟|زياد، إنت غريب اليوم. صار اشي؟

75:{sp:['Bia','Omar'],l:`A|Omar, você já percebeu que o brasileiro fala diferente em cada região?|أومار، ڤوسي جا بيرسيبيو كي أو برازيليرو فالا دجيفيرينتشي إين كادا هيجياو؟|عمر، لاحظت إن البرازيلي بيحكي غير بكل منطقة؟

76:{sp:['Professora','Said'],l:`A|Vamos treinar o ritmo. Repita: «Tô indo pra casa».|ڤاموس ترينار أو هيتمو. هيبيتا: «تو إيندو برا كازا».|خلينا نتدرب عالإيقاع. عيد: «Tô indo pra casa».

78:{sp:['Revisor','Autor'],l:`A|Aqui você escreveu «Me diga a verdade» no início do texto formal.|أكي ڤوسي إيسكريڤيو «مي دجيغا آ ڤيرداجي» نو إينيسيو دو تيكستو فورماو.|هون كتبت «Me diga a verdade» ببداية نص رسمي.

79:{sp:['Aluna','Professor'],l:`A|Professor, «Vou à escola» tem crase?|بروفيسور، «ڤو آ إيسكولا» تين كرازي؟|أستاذ، «Vou à escola» فيها crase؟

80:{sp:['Professora','Aluno'],l:`A|Por que você não fez a tarefa?|بور كي ڤوسي ناو فيز آ تاريفا؟|ليش ما عملت الواجب؟

A|O senhor pode apresentar recurso em quinze dias.|أو سينيور بودجي أبريزينتار هيكورسو إين كينزي دجياس.|بتقدر تقدّم استئناف خلال 15 يوم.`,

82:{sp:['Advogado','Cliente'],l:`A|O senhor recebeu uma intimação para a audiência.|أو سينيور هيسيبيو أوما إينتيماساو بارا آ آوجيينسيا.|وصلك تبليغ لجلسة المحكمة.
B|Isso é grave? Eu sou o réu?|إيسو إيه غراڤي؟ إيو سو أو هيو؟|هاد خطير؟ أنا المدّعى عليه؟
A|Não, o senhor é testemunha. Só precisa relatar o que viu.|ناو، أو سينيور إيه تيستيمونيا. سو بريسيزا هيلاتار أو كي ڤيو.|لا، إنت شاهد. بس لازم تحكي اللي شفته.
B|Preciso levar algum documento?|بريسيزو ليڤار آوغون دوكومينتو؟|لازم أجيب ورقة؟
A|Seu documento com foto e a própria intimação.|سيو دوكومينتو كوم فوتو إي آ بروبريا إينتيماساو.|هويتك مع صورة والتبليغ نفسه.
B|Combinado. A audiência é em março, certo?|كومبينادو. آ آوجيينسيا إيه إين مارسو، سيرتو؟|تمام. الجلسة بآذار، صح؟`,

83:{sp:['Orientadora','Mestrando'],l:`A|Qual é o objetivo da sua pesquisa?|كواو إيه أو أوبجيتشيڤو دا سوا بيسكيزا؟|شو هدف بحثك؟
B|O presente trabalho tem como objetivo analisar o uso de IA no marketing.|أو بريزينتشي تراباليو تين كومو أوبجيتشيڤو أناليزار أو أوزو دجي إي آ نو ماركيتشينغ.|يهدف هذا العمل إلى تحليل استخدام الذكاء الاصطناعي بالتسويق.
A|E a metodologia?|إي آ ميتودولوجيا؟|والمنهجية؟
B|Trata-se de uma pesquisa qualitativa, com entrevistas.|تراتا سي دجي أوما بيسكيزا كواليتاتشيڤا، كوم إينتريڤيستاس.|هو بحث نوعي، مع مقابلات.
A|Evite «eu acho». Prefira «observa-se» ou «constata-se».|إيڤيتي «إيو أشو». بريفيرا «أوبسيرڤا سي» أو «كونستاتا سي».|تجنّب «eu acho». الأفضل «يُلاحَظ» أو «يتبيّن».
B|Vou revisar a introdução com isso em mente.|ڤو هيڤيزار آ إينترودوساو كوم إيسو إين مينتشي.|رح راجع المقدمة على هالأساس.`,

84:{sp:['Editor','Redatora'],l:`A|Neste anúncio, evite «eu» e «nós».|نيستشي أنونسيو، إيڤيتي «إيو» إي «نوس».|بهالإعلان، تجنّبي «أنا» و«إحنا».
B|Então escrevo «Vendem-se apartamentos»?|إينتاو إيسكريڤو «ڤيندين سي أبارتاميينتوس»؟|يعني بكتب «تُباع شقق»؟
A|Isso. E «Precisa-se de vendedores».|إيسو. إي «بريسيزا سي دجي ڤينديدوريس».|صح. و«مطلوب بائعين».
B|Por que «precisa» no singular?|بور كي «بريسيزا» نو سينغولار؟|ليش «precisa» مفرد؟
A|Porque com preposição «de» o verbo não concorda.|بوركي كوم بريبوزيساو «دجي» أو ڤيربو ناو كونكوردا.|لأنه مع حرف الجر «de» الفعل ما بيتطابق.
B|Faz sentido. Fica mais profissional.|فاز سينتيدو. فيكا مايس بروفيسيوناو.|منطقي. بيطلع احترافي أكتر.`,
q:[['ليش بنتجنب «eu» و«nós»؟','لنبرة غير شخصية واحترافية','لأنهم غلط','لأنهم طوال'],['«Vendem-se apartamentos» معناها:','تُباع شقق','بيعوا الشقق','الشقق بايعة'],['ليش «Precisa-se» مفرد؟','بسبب حرف الجر de','لأنه ماضي','لأنه أمر']]},
85:{sp:['Avó','Neto'],l:`A|Não desanime! Devagar se vai ao longe.|ناو ديزانيمي! ديڤاغار سي ڤاي آو لونجي.|لا تيأس! على مهلك بتوصل بعيد.
B|Mas eu não tenho computador para estudar.|ماس إيو ناو تينيو كومبوتادور بارا إيستودار.|بس ما عندي كمبيوتر أدرس عليه.
A|Quem não tem cão caça com gato. Use o celular.|كين ناو تين كاو كاسا كوم غاتو. أوزي أو سيلولار.|اللي ما عنده كلب بيصطاد بالقطة. استعمل الجوال.
B|É verdade. E se eu errar?|إيه ڤيرداجي. إي سي إيو إيهار؟|صح. وإذا غلطت؟
A|Errando é que se aprende.|إيهاندو إيه كي سي أبريندجي.|بالغلط بيتعلم الواحد.
B|Vó, a senhora tem um ditado para tudo!|ڤو، آ سينيورا تين أون دجيتادو بارا تودو!|ستي، عندك مثل لكل اشي!`,
q:[['شو معنى «Devagar se vai ao longe»؟','على مهلك بتوصل بعيد','الطريق طويل','امشي بسرعة'],['شو معنى «Quem não tem cão caça com gato»؟','دبّر حالك باللي عندك','القطط أحسن','ما في حل'],['شو اقترحت الجدة بدل الكمبيوتر؟','الجوال','المكتبة','ما يدرس']]},
86:{sp:['Gestor','Equipe'],l:`A|Pessoal, o prazo é curto. Vamos botar a mão na massa!|بيسواو، أو برازو إيه كورتو. ڤاموس بوتار آ ماو نا ماسا!|يا جماعة، الوقت قصير. يلا نشمّر عن إيدينا!
B|Pode deixar, a gente tira de letra.|بودجي ديشار، آ جينتشي تيرا دجي ليترا.|ولا يهمك، منعملها بسهولة.
A|Mas sem pisar na bola com o cliente, hein?|ماس سين بيزار نا بولا كوم أو كليينتشي، إين؟|بس بدون ما نغلط مع الزبون، ماشي؟
B|Fica tranquilo. Vamos fazer tudo nos trinques.|فيكا ترانكويلو. ڤاموس فازير تودو نوس ترينكيس.|اطمّن. رح نعمل كل اشي مظبوط.
A|Ótimo. Se tudo der certo, a pizza é por minha conta!|أوتشيمو. سي تودو دير سيرتو، آ بيتسا إيه بور مينيا كونتا!|ممتاز. إذا كله مشي منيح، البيتزا على حسابي!`,
q:[['«botar a mão na massa» معناها:','نبلّش شغل جدّي','نطبخ','نرتاح'],['«tirar de letra» معناها:','نعملها بسهولة','نكتب رسالة','نغلط'],['شو وعد المدير؟','بيتزا على حسابه','إجازة','زيادة راتب']]},
87:{sp:['Colega','Said'],l:`A|Said, adorei sua apresentação. Depois a gente marca um café!|سعيد، أدوريي سوا أبريزينتاساو. ديبويس آ جينتشي ماركا أون كافيه!|سعيد، عجبني عرضك كتير. بعدين منتفق عالقهوة!
B|Claro! Quando?|كلارو! كواندو؟|أكيد! إيمتى؟
A|Ah... vamos ver, tá? Te aviso.|آه... ڤاموس ڤير، تا؟ تشي أڤيزو.|آه... منشوف، ماشي؟ ببلّغك.
B|(pensando) «Vamos ver»... no Brasil isso pode ser um «não» educado.|(بينساندو) «ڤاموس ڤير»... نو برازيو إيسو بودجي سير أون «ناو» إيدوكادو.|(بيفكر) «منشوف»... بالبرازيل ممكن تكون «لا» مؤدبة.
A|Obrigada pela ajuda ontem, viu?|أوبريغادا بيلا أجودا أونتين، ڤيو؟|شكرًا على المساعدة مبارح، ها؟
B|Imagina! Não precisa agradecer.|إيماجينا! ناو بريسيزا أغراديسير.|ولا يهمك! ما في داعي تشكري.`,
q:[['شو ممكن تعني «vamos ver»؟','لا مؤدبة أو تأجيل','موافقة أكيدة','رفض قاسي'],['شو قال سعيد للشكر؟','Imagina!','De jeito nenhum','Vamos ver'],['شو معنى «marcar um café»؟','نتفق على لقاء','نشتري قهوة','نشرب لحالنا']]},
88:{sp:['Livreira','Amal'],l:`A|Procura algum livro específico?|بروكورا آوغون ليڤرو إيسبيسيفيكو؟|بتدوّري على كتاب معيّن؟
B|Quero ler literatura brasileira. Por onde começo?|كيرو لير ليتيراتورا برازيليرا. بور أوندجي كوميسو؟|بدي أقرا أدب برازيلي. من وين أبلّش؟
A|Contos são ótimos para começar. São curtos.|كونتوس ساو أوتشيموس بارا كوميسار. ساو كورتوس.|القصص القصيرة ممتازة للبداية.
B|E romances?|إي هومانسيس؟|والروايات؟
A|Machado de Assis é um clássico, mas a linguagem é antiga.|ماشادو دجي أسيس إيه أون كلاسيكو، ماس آ لينغواجين إيه أنتشيغا.|«ماشادو دي أسيس» كلاسيكي، بس لغته قديمة.
B|Vou começar pelos contos e ouvir MPB enquanto leio.|ڤو كوميسار بيلوس كونتوس إي أوڤير إيمي بيه بيه إينكوانتو ليو.|رح أبلّش بالقصص القصيرة وأسمع موسيقى برازيلية وأنا بقرا.`,
q:[['شو نصحت البائعة للبداية؟','القصص القصيرة','الروايات الطويلة','الشعر'],['شو الملاحظة عن ماشادو دي أسيس؟','لغته قديمة','سهل جدًا','مترجم'],['شو رح تسمع أمل؟','موسيقى برازيلية (MPB)','أخبار','بودكاست']]},
89:{sp:['Professora','Aluno'],l:`A|Espero que você tenha gostado da aula.|إيسبيرو كي ڤوسي تينيا غوستادو دا آولا.|بتمنى تكون عجبتك الحصة.
B|Gostei! Mas «tenha gostado» é difícil.|غوستيي! ماس «تينيا غوستادو» إيه دجيفيسيو.|عجبتني! بس «tenha gostado» صعبة.
A|É o pretérito perfeito do subjuntivo. Outro exemplo: «Talvez ele já tenha saído».|إيه أو بريتيريتو بيرفيتو دو سوبجونتشيڤو. أوترو إيزيمبلو: «تاوڤيز إيلي جا تينيا سايدو».|هاد الماضي التام بصيغة الشك. مثال تاني: «يمكن يكون طلع».
B|E na literatura aparece «fizera» no lugar de «tinha feito»?|إي نا ليتيراتورا أباريسي «فيزيرا» نو لوغار دجي «تشينيا فيتو»؟|وبالأدب بتطلع «fizera» بدل «tinha feito»؟
A|Exato! É o mais-que-perfeito simples, típico de livros.|إيزاتو! إيه أو مايس كي بيرفيتو سيمبليس، تشيبيكو دجي ليڤروس.|بالضبط! الماضي الأسبق البسيط، بيطلع بالكتب.
B|Então é para ler, não para falar.|إينتاو إيه بارا لير، ناو بارا فالار.|يعني للقراءة، مش للحكي.`,
q:[['«tenha gostado» من أي زمن؟','الماضي التام بصيغة الشك','المستقبل','الأمر'],['«fizera» معناها مثل:','tinha feito','fará','faça'],['وين بيستعمل «fizera»؟','بالكتب والأدب','بالحكي اليومي','بالواتساب']]},
90:{sp:['Estrangeiro','Brasileira'],l:`A|Onde fica o banco mais próximo?|أوندجي فيكا أو بانكو مايس بروسيمو؟|وين أقرب بنك؟
B|Fica a duas quadras. Mas hoje não deu certo para mim, estava fechado.|فيكا آ دواس كوادراس. ماس أوجي ناو ديو سيرتو بارا مين، إيستاڤا فيشادو.|على بعد شارعين. بس اليوم ما زبط معي، كان مسكّر.
A|Que pena. Fico preocupado, preciso pagar uma conta.|كي بينا. فيكو بريوكوبادو، بريسيزو باغار أوما كونتا.|خسارة. بقلق، لازم أدفع فاتورة.
B|Dá para pagar pelo aplicativo. Leva um minuto.|دا بارا باغار بيلو أبليكاتشيڤو. ليڤا أون مينوتو.|بتقدر تدفع من التطبيق. بياخد دقيقة.
A|Boa! Deu para entender. Vou fazer isso.|بوا! ديو بارا إينتيندير. ڤو فازير إيسو.|حلو! فهمت. رح أعملها.
B|Se der problema, me chama.|سي دير بروبليما، مي شاما.|إذا صار مشكلة، ناديني.`,
q:[['«fica» هون بمعنى:','موجود/بيقع','بيضل','بيصير'],['«não deu certo» معناها:','ما زبط','ما أعطى','ما صح'],['كيف بيقدر يدفع؟','من التطبيق','بالبنك بس','ما بيقدر']]},
91:{sp:['Jornalista','Economista'],l:`A|A inflação subiu no último mês. O que isso significa para as famílias?|آ إينفلاساو سوبيو نو أولتشيمو ميس. أو كي إيسو سيغنيفيكا بارا آس فاميلياس؟|التضخم ارتفع الشهر الماضي. شو بيعني هاد للعائلات؟
B|Significa que o dinheiro compra menos no supermercado.|سيغنيفيكا كي أو دجينييرو كومبرا مينوس نو سوبيرميركادو.|يعني المصاري بتشتري أقل بالسوبرماركت.
A|E o Banco Central?|إي أو بانكو سينتراو؟|والبنك المركزي؟
B|Manteve a taxa de juros, o que encarece o crédito.|مانتيڤي آ تاشا دجي جوروس، أو كي إينكاريسي أو كريدجيتو.|أبقى سعر الفائدة، وهاد بيغلّي القروض.
A|Qual seria uma dica para quem está chegando ao Brasil?|كواو سيريا أوما دجيكا بارا كين إيستا شيغاندو آو برازيو؟|شو نصيحتك للي واصل جديد عالبرازيل؟
B|Evitar parcelar com juros e comparar preços antes de comprar.|إيڤيتار بارسيلار كوم جوروس إي كومبارار بريسوس أنتشيس دجي كومبرار.|يتجنب التقسيط بفوايد ويقارن الأسعار قبل ما يشتري.`,
q:[['شو بيعني ارتفاع التضخم للعائلات؟','المصاري بتشتري أقل','الرواتب بتزيد','الأسعار بتنزل'],['شو عمل البنك المركزي؟','أبقى سعر الفائدة','نزّله','ألغاه'],['شو النصيحة للواصلين الجداد؟','تجنب التقسيط بفوايد وقارن الأسعار','اقترض كتير','ما تشتري اشي']]},
92:{sp:['Said','Investidora'],l:`A|Obrigado pelo seu tempo. Vou apresentar a nossa agência em dois minutos.|أوبريغادو بيلو سيو تيمبو. ڤو أبريزينتار آ نوسا أجينسيا إين دويس مينوتوس.|شكرًا على وقتك. رح أعرض وكالتنا بدقيقتين.
B|Pode começar.|بودجي كوميسار.|تفضّل.
A|Produzimos vídeos e conteúdo em árabe e português para marcas que querem alcançar a comunidade árabe no Brasil.|برودوزيموس ڤيدجيوس إي كونتيودو إين آرابي إي بورتوغيس بارا ماركاس كي كيرين آوكانسار آ كومونيدادجي آرابي نو برازيو.|منعمل فيديوهات ومحتوى بالعربي والبرتغالي لماركات بدها توصل للجالية العربية بالبرازيل.
B|Qual é o diferencial de vocês?|كواو إيه أو دجيفيرينسياو دجي ڤوسيس؟|شو اللي بيميّزكم؟
A|Conhecemos as duas culturas. Isso gera mais engajamento e confiança.|كونيسيموس آس دواس كولتوراس. إيسو جيرا مايس إينغاجامينتو إي كونفيانسا.|منعرف الثقافتين. وهاد بيجيب تفاعل وثقة أكتر.
B|Interessante. Me mande uma proposta por escrito.|إينتيريسانتشي. مي ماندي أوما بروبوستا بور إيسكريتو.|مثير للاهتمام. ابعتلي عرض مكتوب.`,

const KIMG=(()=>{try{return JSON.parse(localStorage.getItem('kimg')||'{}')}catch(e){return {}}})();
async function wikiImg(title){
  if(KIMG[title]!==undefined)return KIMG[title];
  try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title.replace(/ /g,'_')));if(!r.ok)throw 0;const j=await r.json();const u=(j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source)||'';
    KIMG[title]=u?u.replace(/\/\d+px-/,'/480px-'):'';try{localStorage.setItem('kimg',JSON.stringify(KIMG))}catch(e){}return KIMG[title]}
  catch(e){return ''}
}
function kidPic(k,it,big){
  if(k.color)return `<span class="kpic kcol" style="background:${it.img}"></span>`;
  if(k.num)return `<span class="kpic knum">${'⭐'.repeat(+it.img)}<b>${it.img}</b></span>`;
  if(k.phrase||!it.img||it.img==='-')return `<span class="kpic kemo">${it.em}</span>`;
  return `<span class="kpic kimg" data-wiki="${esc(it.img)}"><span class="kemo">${it.em}</span></span>`;
}
function hydrateKidPics(root){
  $$('[data-wiki]',root).forEach(async el=>{const u=await wikiImg(el.dataset.wiki);if(u&&el.isConnected){const im=new Image();im.alt='';im.loading='lazy';im.referrerPolicy='no-referrer';im.onload=()=>{el.innerHTML='';el.appendChild(im);el.classList.add('loaded')};im.src=u}});
}

  const nd=CH.filter(c=>chDone(c.id)).length,ne=UNITS.filter(u=>exDone(u.n)).length,nx=nextItem();

  else if(nx.t==='ch'){const c=CH[nx.id-1],u=unitOf(c.id),n=stepsOf(c.id).filter(([k])=>stepDone(c.id,k)).length,N=stepsOf(c.id).length;cont=`<a class="continue" href="#ch-${c.id}"><span class="eyebrow">كمّل من هون · ${esc(LEVELS[lvOf(u)-1].name)} · الدرس ${c.id}</span><span class="big pt" lang="pt-BR" dir="ltr">${esc(c.pt)}</span><span>${esc(c.ar)} · ${n} من ${N} خطوات</span><span class="bar"><i style="width:${n/N*100}%"></i></span><span class="cta">${n?'كمّل':'ابدأ'} الدرس ←</span></a>`}
  else cont=`<a class="continue" href="#exam-${nx.id}"><span class="eyebrow">${esc(examName(nx.id))}</span><span class="big">قراءة · استماع · قواعد · مفردات · كتابة</span><span class="cta">ابدأ الاختبار ←</span></a>`;
  const node=id=>{const c=CH[id-1],d=chDone(id),op=chOpen(id),n=stepsOf(id).filter(([k])=>stepDone(id,k)).length;const cls=d?'done':op?'open':'locked';const st=d?`${S.ch[id].quiz}%`:op?(n?`${n}/${stepsOf(id).length}`:'متاح'):'مقفل';
    const inner=`<span class="num">${d?'✓':id}</span><span class="t">${P(c.pt)}<small>${esc(c.ar)}</small></span><span class="st">${st}</span>`;
    return op?`<a class="node ${cls}" href="#ch-${id}">${inner}</a>`:`<div class="node ${cls}" aria-disabled="true">${inner}</div>`};
  const enode=(k,label)=>{const d=exDone(k),op=exOpen(k);const cls='exam '+(d?'done':op?'open':'locked');const st=d?`${S.ex[exKey(k)].total}%`:op?'متاح':'بعد الدروس';
    const inner=`<span class="num">★</span><span class="t"><b>${label}</b><small>قراءة · استماع · قواعد · مفردات · كتابة</small></span><span class="st">${st}</span>`;
    return op?`<a class="node ${cls}" href="#exam-${k}">${inner}</a>`:`<div class="node ${cls}" aria-disabled="true">${inner}</div>`};
  const lvCard=L=>{const us=unitsOf(L.n);if(!us.length)return `<section class="level-card dim"><div class="level-h"><div><h2>${L.name}</h2><span class="muted">${esc(L.sub)}</span></div><span class="tag">${L.tag}</span></div><p class="muted" style="margin:0">قيد الإعداد، رح ينضاف قريبًا.</p></section>`;
    const chs=us.flatMap(u=>u.chs),open=lvOpen(L.n),done=chs.filter(chDone).length;
    const nw=chs.reduce((a,i)=>a+CH[i-1].W.length,0),ns=chs.reduce((a,i)=>a+CH[i-1].S.length,0);
    const head=`<div class="level-h"><div><h2>${L.name}</h2><span class="muted">${esc(L.sub)} · ${chs.length} درس · ${nw} كلمة · ${ns} جملة</span></div><span class="tag">${L.tag}</span></div><div class="lv-prog"><i style="width:${done/chs.length*100}%"></i></div>`;
    if(!open)return `<section class="level-card dim">${head}<p class="muted" style="margin:0">بينفتح لما تنجح بالامتحان النهائي لـ${LEVELS[L.n-2].name}.</p></section>`;
    const isNext=nx&&((nx.t==='ch'&&chs.includes(nx.id))||(nx.t==='ex'&&(us.some(u=>u.n===nx.id)||nx.id==='f'+L.n)));
    return `<details class="level-card" ${isNext||L.n===1&&!nx?'open':''}><summary>${head}</summary>${us.map(u=>`<section class="unit"><div class="unit-h"><span class="u-n">الوحدة ${u.n}</span><span class="pt" lang="pt-BR" dir="ltr">${esc(u.pt)}</span><span class="muted">${esc(u.ar)}</span></div><div class="nodes">${u.chs.map(node).join('')}${enode(u.n,'اختبار الوحدة '+u.n)}</div></section>`).join('')}<div class="nodes" style="margin-top:12px">${enode('f'+L.n,examName('f'+L.n))}</div></details>`};
  app.innerHTML=`<div class="stack">
   <div class="hello"><h1>${P(MY_NAME?'Olá, '+MY_NAME+'!':'Olá!')}</h1><p>كل يوم: درس واحد أو خطوتين منه، ولعبة سريعة. 20 دقيقة بتكفي.</p></div>
   ${loginNote()}
   ${srsDue().length?`<a class="exam-cd" href="#review" style="background:var(--green-soft);border-color:var(--green)"><span class="cd-n">${srsDue().length}</span><span class="cd-t"><b>مراجعة اليوم</b><small>أغلاط سابقة لازم ترجعلها اليوم</small></span><span class="cd-go">راجع ←</span></a>`:''}
   <div class="stats"><div class="stat"><b>${S.xp}</b><span>نقاط XP</span></div><div class="stat"><b>${streakNow()}</b><span>أيام ورا بعض</span></div><div class="stat"><b>${nd}<small>/${CH.length}</small></b><span>دروس مخلّصة</span></div><div class="stat"><b>${ne}<small>/${UNITS.length}</small></b><span>اختبارات وحدات</span></div></div>
   ${cont}
   ${LEVELS.map(lvCard).join('')}
   <a class="btn" href="#settings">إعدادات الصوت والتقدّم</a></div>`;
}

let chState={id:0,step:null};
function vChapter(id){
  const c=CH[id-1];if(!c)return vHome();

const dayNum=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const BOXES=[1,3,7,14,30];
const WMAP=new Map(),SMAP=new Map(),DMAP=new Map();
function buildMaps(){CH.forEach(c=>{c.W.forEach(w=>WMAP.set(w.key,w));c.S.forEach(s=>SMAP.set(s.key,s));c.D.forEach(d=>DMAP.set('d|'+d[0],{d,ch:c.id}))});}
function srsRecord(q,credit){if(!q||!q.key)return;S.srs=S.srs||{};const it=S.srs[q.key];
  if(credit<1)S.srs[q.key]={b:0,due:dayNum()+1};
  else if(it){const b=it.b+1;if(b>=BOXES.length)delete S.srs[q.key];else S.srs[q.key]={b,due:dayNum()+BOXES[b]}}}
const srsDue=()=>Object.entries(S.srs||{}).filter(([k,v])=>v.due<=dayNum()&&(WMAP.has(k)||SMAP.has(k)||DMAP.has(k)));
const srsTotal=()=>Object.keys(S.srs||{}).length;
function reviewQs(){const due=shuffle(srsDue()).slice(0,15);const W=allWords(),Sx=allSents();
  return due.map(([k])=>{
    if(WMAP.has(k)){const w=WMAP.get(k);const r=Math.random();const q=r<.3?qPt2Ar(w,W):r<.55?qAr2Pt(w,W):r<.8?qListen(w,W):Q.type(w.ar,w.pt);q.key=k;return q}
    if(SMAP.has(k)){const s=SMAP.get(k);const r=Math.random();const q=r<.35?Q.scr(s.ar,s.pt):r<.7?qS2Ar(s,Sx):qDict(s);q.key=k;return q}
    const q=drillQ(DMAP.get(k).d);return q});
}

let DICT=null,dictHandler=null;
(async()=>{try{if(await waitClaude()){DICT=await claude.use('dictation');if(DICT){DICT.onPartial(e=>dictHandler&&dictHandler('partial',e));DICT.onFinal(e=>dictHandler&&dictHandler('final',e));DICT.onState(e=>dictHandler&&dictHandler('state',e))}}}catch(e){DICT=null}})();
function compareSpeech(target,heard){const T=nrm(target).split(' ').filter(Boolean),H=nrm(heard).split(' ').filter(Boolean);
  const m=T.length,n=H.length;const L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=T[i]===H[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ok=new Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(T[i]===H[j]){ok[i]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  return{ok,score:m?ok.filter(Boolean).length/m:0}}

function chatSystem(sc,lv){return `You are a Brazilian Portuguese conversation partner for an Arabic-speaking learner who lives in Brazil, Brazil.

If the learner's last message has Portuguese mistakes (grammar, vocabulary, spelling, accent marks, or unnatural phrasing), pick the ONE most important and correct it. If the learner wrote in Arabic or English, show how to say it in Portuguese as the correction. If there is no mistake, correction is null.
Respond with ONLY a JSON object, no other text:
{"reply":"...","reply_ar":"simple Arabic translation of reply","correction":null or {"you_said":"...","better":"...","why_ar":"one short explanation in simple Arabic"},"suggestions":["two short things the learner could say next, in Portuguese"]}`}
async function askClaude(msgs){
  if(!(await waitClaude()))throw{code:'unavailable'};
  const sample=await claude.use('sample');if(!sample)throw{code:'unavailable'};
  let v=null;
  try{if(typeof sample.json==='function')v=await sample.json(msgs,{cache:false,modelTier:'default'})}catch(e){if(e&&(e.code==='not_granted'||e.code==='rate_limited'))throw e}
  if(!v||typeof v!=='object'){const r=await sample(msgs,{cache:false,modelTier:'default'});const t=r.text||'';const a=t.indexOf('{'),b=t.lastIndexOf('}');v=JSON.parse(t.slice(a,b+1))}
  return v;
}

    $('#send').disabled=false};
  const send=()=>{const t=$('#cin').value.trim();if(!t)return;$('#cin').value='';chatSt.view.push({me:true,text:t});chatSt.msgs.push({role:'user',content:t});sugg([]);turn()};

  const draw=()=>{const c=certCanvas(S.name||'',L,ex.total,ex.date||today());const url=c.toDataURL('image/png');
    app.innerHTML=`<div class="stack"><a class="back" href="#practice">→ التدريب</a><h1 style="font-size:22px">شهادة ${esc(L.name)}</h1>
     <label for="nm">الاسم على الشهادة</label><input class="search" id="nm" value="${esc(S.name||'')}" placeholder="اكتب اسمك بالحروف اللاتينية" dir="ltr">
     <img src="${url}" alt="شهادة ${esc(L.name)}" style="width:100%;border-radius:12px;border:1px solid var(--line)">
     <div class="row"><button class="btn primary" id="dl">حمّل الشهادة</button></div><p class="muted" style="margin:0;font-size:13px">إذا ما اشتغل التحميل، اضغط مطوّل على الصورة واحفظها.</p></div>`;
    $('#nm').onchange=e=>{S.name=e.target.value.trim();save();draw()};
    $('#dl').onclick=async()=>{try{const d=await claude.use('downloads');if(!d)throw 0;const blob=await new Promise(r=>c.toBlob(r,'image/png'));await d.save({filename:`certificado-${L.tag}.png`,data:blob})}catch(e){toast('اضغط مطوّل على الصورة واحفظها.')}}};
  draw();
}

/* ===== مركز التدريب ===== */
function vPractice(){
  const n=srsDue().length;const certs=LEVELS.filter(L=>exDone('f'+L.n));
  const card=(href,ic,t,d,badge,c)=>`<a class="gcard" href="${href}"><span class="gi" style="background:${c}">${ic}</span><h3>${t}${badge?` <span class="badge">${badge}</span>`:''}</h3><p>${d}</p></a>`;
  app.innerHTML=`<div class="stack"><div><h1 style="font-size:24px">التدريب</h1><p class="muted" style="margin:4px 0 0">كل شي بيقوّيك برا الدروس.</p></div>
   <div class="ggrid">
   ${card('#review','🔁','مراجعة اليوم','أغلاطك بترجعلك بمواعيد ذكية لحد ما تثبت.',n||'', 'var(--sun-soft)')}
   ${card('#speak','🎤','تمرين الحكي','قول الجمل بصوتك، وشوف شو انفهم.','','var(--green-soft)')}
   ${card('#chat','💬','محادثة مع Claude','مواقف حقيقية مع تصحيح فوري.','','var(--blue-soft)')}
   ${card('#stories','🎧','قصص مسموعة','حوار بصوتين لكل وحدة مع أسئلة.','','var(--green-soft)')}
   ${card('#sounds','👂','الأصوات الصعبة','p/b، v/f، r/rr، ó/ô، lh، nh…','','var(--blue-soft)')}
   ${card('#games','🎮','الألعاب','مطابقة، اسمع واختار، رتّب، صح ولا غلط.','','var(--bad-soft)')}
   ${card('#placement','🧭','تحديد المستوى','اعرف من وين تبدأ.',S.place||'','var(--sun-soft)')}
   ${card(certs.length?'#cert-'+certs[certs.length-1].n:'#cert-1','🎓','شهاداتي',certs.length?certs.map(L=>L.tag).join(' · '):'بعد النجاح بامتحان نهائي.','','var(--green-soft)')}
   </div></div>`;
}

buildMaps();
route();
initCloud().then(startSession);
</script>
